# Netlify 배포 설정: public/ 폴더만 배포 (.env, scripts, tests 등은 올라가지 않음)
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    # 태블릿 카메라(사진 인증)와 위치(위치 확인, v12)는 이 사이트에만 허용, 마이크는 막기
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
    # 배포 직후 태블릿이 옛 파일을 쓰지 않도록 항상 최신 확인
    Cache-Control = "no-cache"
