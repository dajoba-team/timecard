<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="타임카드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0F2F5">
<title>가게 타임카드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="storage.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 페이지에 두 모드 — 가게 태블릿용 '출퇴근 화면'(큰 시계 + 이름 버튼 + 번호 패드)과 사장님용 관리 화면(탭).
   타임카드 펀치 잉크(파랑 = 정상, 빨강 = 지각)를 상태색의 기본으로 삼는다. */
:root{
  --paper:#F0F2F5; --card:#FFFFFF; --ink:#151B24; --muted:#5E6774; --line:#DADFE7; --soft:#E8ECF1;
  --stamp:#2A3FC7; --stamp-soft:#E3E7FB; --red:#C4302A; --red-soft:#FBE5E3;
  --green:#1D7A4E; --green-soft:#E0F2E8; --amber:#A05D00; --amber-soft:#FBEED6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1217; --card:#161B22; --ink:#E7EBF1; --muted:#97A1AF; --line:#2A313B; --soft:#1E242D;
  --stamp:#8391FF; --stamp-soft:#1E2444; --red:#FF6E64; --red-soft:#3A1D1B;
  --green:#4FC48B; --green-soft:#132E20; --amber:#F2A73D; --amber-soft:#33260F; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E1217; --card:#161B22; --ink:#E7EBF1; --muted:#97A1AF; --line:#2A313B; --soft:#1E242D;
  --stamp:#8391FF; --stamp-soft:#1E2444; --red:#FF6E64; --red-soft:#3A1D1B;
  --green:#4FC48B; --green-soft:#132E20; --amber:#F2A73D; --amber-soft:#33260F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
button.brand{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;border-radius:10px}
button.brand:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
.mark{width:36px;height:36px;border-radius:8px;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;transform:rotate(-6deg)}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;order:3;width:100%;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;position:relative}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-style:normal;margin-left:6px;font-weight:600}
@media (min-width:900px){.tabs{order:0;width:auto}}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

#banner:not(:empty){margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--amber-soft);color:var(--amber);font-size:14px}
main{padding-top:18px}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 small{color:var(--muted);font-weight:400;font-size:13px}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.cols{grid-template-columns:3fr 2fr}}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:20px;margin-right:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.stat b{font-size:22px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.stat.red b{color:var(--red)} .stat.amber b{color:var(--amber)} .stat.blue b{color:var(--stamp)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--stamp-soft);color:var(--stamp)}
.chip.faint{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.working{background:var(--stamp)} .dot.done{background:var(--green)} .dot.late{background:var(--red)} .dot.wait{background:var(--amber)}

/* tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t tr.edit td{background:var(--soft)}
.t .late{color:var(--red);font-weight:600}
.t tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* month grid */
.mgrid{border-collapse:separate;border-spacing:2px;font-size:12px}
.mgrid th{font-weight:500;color:var(--muted);padding:2px;text-align:center;min-width:34px}
.mgrid th.name{text-align:left;min-width:84px;position:sticky;left:0;background:var(--card);z-index:1}
.mgrid th.we{color:var(--red)}
.mgrid td{text-align:center;height:34px;border-radius:6px;background:var(--soft);font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:0 2px}
.mgrid td.name{text-align:left;background:var(--card);font-family:var(--f-body);font-weight:600;position:sticky;left:0;z-index:1;padding-right:8px;white-space:nowrap}
.mgrid td.tot{background:transparent;font-weight:600;white-space:nowrap;padding:0 8px}
.mgrid td button{all:unset;cursor:pointer;display:block;width:100%;height:100%;line-height:34px}
.c-done{background:var(--green-soft)!important;color:var(--green)}
.c-late{background:var(--red-soft)!important;color:var(--red);font-weight:600}
.c-absent{background:var(--red)!important;color:#fff;font-weight:600}
.c-wait{background:var(--amber-soft)!important;color:var(--amber)}
.c-extra{background:var(--stamp-soft)!important;color:var(--stamp)}
.c-leave{color:var(--muted)}
.c-sched{color:var(--muted);background:transparent!important;border:1px dashed var(--line)}
.c-off{background:transparent!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--stamp);color:#fff}
.nav{display:inline-flex;align-items:center;gap:6px}
.nav b{min-width:120px;text-align:center}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px}

/* kiosk */
.kclock{text-align:center;padding-block:18px 8px}
.kdate{color:var(--muted);font-size:16px}
.ktime{font-size:clamp(48px,11vw,96px);font-weight:600;letter-spacing:.02em;line-height:1.1}
.khint{text-align:center;color:var(--muted);margin:6px 0 18px}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));max-width:960px;margin:0 auto}
.kname{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:110px}
.kname:hover{border-color:var(--stamp)}
.kname b{font-size:20px}
.kname small{grid-column:2;color:var(--muted);font-size:13px}
.kname em{grid-column:1/3;font-style:normal;font-size:13px;margin-top:8px;font-family:var(--f-mono);color:var(--muted)}
.kpanel{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.kpanel h2{font-size:24px}
.kpanel p{color:var(--muted);margin:6px 0 0}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:24px;font-family:var(--f-mono);font-weight:600}
.pad button.fn{font-size:15px;font-family:var(--f-body);color:var(--muted)}
.pad button:active{background:var(--stamp-soft)}
.err{color:var(--red)!important;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bigbtn{width:100%;height:84px;border-radius:14px;border:0;font-size:26px;font-weight:700;color:#fff;background:var(--stamp);margin-top:18px}
.bigbtn.out{background:var(--ink);color:var(--card)}
.bigbtn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:6px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;margin-top:14px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camstamp{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;text-align:left;font-size:13px}
.camstamp b{display:block;font-family:var(--f-mono);font-size:32px;line-height:1.1}
.cammsg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px}
.filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{display:none}
.taxtext{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;line-height:1.65;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:8px 0 0;max-height:420px;overflow:auto}
.taxset{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.taxset label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.taxset label.check{display:flex;align-items:center;gap:6px}
.taxset input[type=text],.taxset input:not([type]){border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink);min-width:240px}
.inlnum{width:130px;text-align:right;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;color:var(--ink);font-family:var(--f-mono)}
.form.pt-m .pt-hour{display:none}
.form:not(.pt-m) .pt-month{display:none}
.kpanel.wide{max-width:780px;text-align:left}
.kpanel.wide h2,.kpanel.wide > p{text-align:center}
.contract{font-size:14px;line-height:1.7;color:var(--ink)}
.contract h1{font-size:20px;text-align:center;letter-spacing:.15em;margin:4px 0 14px}
.contract .terms{padding-left:20px;margin:8px 0}
.contract .art{margin:12px 0}
.contract .art h5{font-size:14px;margin:0 0 4px}
.contract .art p{margin:2px 0 2px 14px}
.contract .art p.sub{margin-left:30px}
.contract .parties.shop p{margin:3px 0}
.contract .terms li{margin:6px 0}
.contract .terms ul{padding-left:18px;margin:2px 0}
.contract table.ct{border-collapse:collapse;margin:6px 0;width:100%;font-size:13px}
.contract table.ct th,.contract table.ct td{border:1px solid var(--line);padding:3px 6px;text-align:center}
.contract table.ct thead th{background:var(--soft)}
.contract .cdate{text-align:center;margin:14px 0}
.contract .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contract .parties h4{margin:0 0 4px}
.contract .parties p{margin:2px 0}
.contract .meta{margin-top:16px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
@media (max-width:560px){.contract .parties{grid-template-columns:1fr}}
.cbox{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper);margin:14px 0}
.ksign{margin-top:6px}
.sigline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig{height:48px;max-width:170px;background:#fff;border-radius:4px}
.sig.sigsm{height:36px;vertical-align:middle}
.sigph{color:var(--muted)}
.sigwrap{position:relative;margin-top:14px}
.sigpad{display:block;width:100%;height:170px;touch-action:none;background:#fff;border:2px dashed var(--line);border-radius:10px;cursor:crosshair}
.sighint{position:absolute;left:0;right:0;top:72px;text-align:center;color:#999;pointer-events:none;font-size:15px}
.sigwrap.signed .sighint{display:none}
.sigclr{position:absolute;right:8px;top:8px}
.kphoto{display:block;width:100%;max-width:260px;margin:14px auto 0;border-radius:10px}
.thumbbtn{border:0;padding:0;background:none;margin-left:6px;vertical-align:middle;cursor:zoom-in}
.thumbbtn img{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);display:block;background:var(--soft)}
.thumbbtn.gone img{display:none}
.thumbbtn.gone::after{content:'사진 지움';font-size:11px;color:var(--muted)}
#modal img.big{max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:8px}
.mysum{margin-top:18px;padding:12px;border-radius:10px;background:var(--soft);font-size:13px;text-align:left}
.mysum b{font-family:var(--f-mono)}
.stamp{display:inline-block;margin:18px auto 6px;padding:10px 22px;border:4px double var(--stamp);color:var(--stamp);border-radius:8px;transform:rotate(-4deg);font-family:var(--f-mono);font-weight:600;font-size:20px}
.stamp b{display:block;font-size:44px;line-height:1.1}
.stamp.red{border-color:var(--red);color:var(--red)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .35s ease-out}}
@keyframes thump{0%{transform:scale(1.6) rotate(-4deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.empty{max-width:520px;margin:20px auto;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:24px}
.empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}

/* board & feed */
.board{display:grid;gap:8px}
.bitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--soft);border-radius:10px}
.bitem b{font-size:15px}
.bitem .sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--soft);font-size:14px}
.feed time{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.feed li.late{color:var(--red)} .feed li.wait{color:var(--amber)}
.alertbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--stamp-soft);margin-bottom:16px;font-size:14px}
.alertbar b{color:var(--stamp)}
.mailbar{background:var(--soft)}
.mailbar.on{background:var(--green-soft)}
.mailbar.on b{color:var(--green)}
.mailst{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

/* timecard */
.tcs{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.tc header{display:flex;align-items:baseline;gap:8px;padding:14px 16px 0}
.tc header b{font-size:17px}
.tc header small{color:var(--muted)}
.tcline{margin:12px 16px;padding:12px;border:1.5px solid var(--ink);border-radius:6px;font-family:var(--f-mono);font-size:14px;line-height:1.9}
.tcline span{white-space:nowrap}
.tcline b{font-weight:600}
.tcmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;font-size:13px}
.tcmeta div{background:var(--soft);border-radius:8px;padding:6px 8px}
.tcmeta small{display:block;color:var(--muted);font-size:11px}
.tcmeta b{font-family:var(--f-mono)}
.tc details{border-top:1px solid var(--soft)}
.tc summary{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:13px}
.tc .tcfoot{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.cardtab{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12.5px}
.cardtab td,.cardtab th{padding:4px 8px;border-bottom:1px solid var(--soft);text-align:right}
.cardtab th{font-family:var(--f-body);font-weight:500;color:var(--muted)}
.cardtab td:first-child,.cardtab th:first-child{text-align:left}
.cardtab .late{color:var(--red);font-weight:600}
.cardtab .ot{color:var(--stamp);font-weight:600}
.cardtab tr.we td:first-child{color:var(--red)}

/* payroll */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .act{stroke:var(--stamp);stroke-width:2.5;fill:none}
.chart .area{fill:var(--stamp);opacity:.12}
.chart .proj{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:5 5}
.chart .today{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:3 3}
.chart .mk{fill:var(--card);stroke:var(--stamp);stroke-width:2.5}
.chart .mk.p{stroke:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:600}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px}

async function translateTexts(texts, to){
  if (!window.tcStore?.invoke) throw new Error('번역을 쓸 수 없는 화면이에요');
  const r = await window.tcStore.invoke('tc-translate', { texts, to });
  if (!Array.isArray(r?.translations) || r.translations.length !== texts.length) throw new Error(r?.error || '번역하지 못했어요');
  return r.translations;
}
async function tryTranslate(texts, to){ try { return await translateTexts(texts, to); } catch (e){ S.trWarn = e?.message || ''; console.warn('자동 번역 안 됨:', S.trWarn); return null; } }

/* ===================== 근무 계산 ===================== */
const WORKED = new Set(['done','working','extra']);
function getPunch(staffId, ds){ return S.months[ymOf(ds)]?.get(`${staffId}_${ds}`); }
function monthHasPunch(id, ym){ const m = S.months[ym]; if (!m) return false; for (const p of m.values()) if (p.staffId === id) return true; return false; }
function staffForMonth(ym){ return S.staff.filter(s => s.active !== false || monthHasPunch(s.id, ym)); }
function staffForDay(ds){ return S.staff.filter(s => s.active !== false || getPunch(s.id, ds)); }

function schedFor(st, ds, p){
  if (p && p.sched !== undefined) return p.sched;
  if (st.hireDate && ds < st.hireDate) return null;
  if (st.endDate && ds > st.endDate) return null;
  const s = st.sched?.[parseDate(ds).getDay()];
  return s && s.on ? { start:s.start, end:s.end, brk:+s.brk||0 } : null;
}
function isRegularOff(st, ds){   // 근무 기간 안인데 근무표에서 체크 안 한 요일 = 정기 휴무
  if (st.hireDate && ds < st.hireDate) return false;
  if (st.endDate && ds > st.endDate) return false;
  const s = st.sched?.[parseDate(ds).getDay()];
  return !(s && s.on);
}
function shiftMin(sc){ let a = hm2min(sc.start), b = hm2min(sc.end); if (b <= a) b += 1440; return Math.max(0, b - a - (+sc.brk||0)); }
function weeklySchedMin(st){ return (st.sched||[]).reduce((t, s) => t + (s && s.on ? shiftMin(s) : 0), 0); }

// 출퇴근 평가 시작일 (v34): 이 날부터 지각·조퇴·결근·점수를 계산. 비우면 처음부터
const evalOn = ds => ds >= (cfg().evalStart || '');
function dayCalc(st, ds, now = Date.now(), pOver){   // pOver: 저장 전 기록으로 미리 계산 (퇴근 직후 추가근무 확인)
  const C = cfg(), p = pOver || getPunch(st.id, ds), sc = schedFor(st, ds, p), pre = !evalOn(ds);
  const r = { ds, p, sc, status:'off', worked:0, paid:0, ot:0, late:0, early:0, running:false, schedMin:0, regOff: !sc && isRegularOff(st, ds), preEval:pre };
  const grace = (+C.graceMin||0) * 60000;
  if (sc){
    r.sStart = at(ds, sc.start); r.sEnd = at(ds, sc.end);
    if (r.sEnd <= r.sStart) r.sEnd += 86400000;
    r.schedMin = shiftMin(sc);
  }
  if (p && p.kind === 'leave'){ r.status = 'leave'; return r; }
  if (p && p.in){
    if (sc && !pre && p.in > r.sStart + grace) r.late = Math.round((p.in - r.sStart)/60000);   // 평가 시작 전은 지각 아님
    let out = p.out;
    if (!out){
      if (now - p.in < 20*3600000){ out = now; r.running = true; }
      else { r.status = 'noout'; return r; }
    }
    if (sc && !pre && p.out && p.out < r.sEnd - grace) r.early = Math.round((r.sEnd - p.out)/60000);
    const effIn = (C.earlyClamp && sc && p.in < r.sStart) ? r.sStart : p.in;
    const gross = Math.max(0, (out - effIn)/60000);
    const brk = sc ? (gross >= 240 ? sc.brk : 0) : (gross >= 480 ? 60 : gross >= 240 ? 30 : 0);
    r.worked = Math.max(0, Math.floor(gross - brk));
    if (sc){
      const unit = Math.max(1, +C.otUnit||1);
      r.ot = r.running ? 0 : Math.floor(Math.max(0, r.worked - r.schedMin)/unit)*unit;
      r.otRaw = r.ot;   // 실제로 더 일한 시간 (승인과 상관없이)
      if (r.ot && otApplies(ds)){   // 추가근무 승인제: 승인된 만큼만 급여에, 나머지는 확인 대기(급여에 안 들어감) 또는 불인정
        // 사장님이 '먼저 하고 보고'를 결정했으면(승인·일부 승인·불인정) 나머지는 불인정. 미리 요청만 있는 상태에서 더 일한 시간은 다시 확인 대기
        const o = otDoc(st.id, ds), ok = Math.min(r.ot, Math.floor((+o?.okMin || 0)/unit)*unit), no = !!o && o.kind === 'post' && o.status !== 'pending';
        r.otDoc = o || null; r.otWait = no ? 0 : r.ot - ok; r.otNo = no ? r.ot - ok : 0; r.ot = ok;
      }
      r.paid = Math.min(r.worked, r.schedMin) + r.ot;
    } else { r.ot = r.worked; r.paid = r.worked; }
    r.status = r.running ? 'working' : (sc ? 'done' : 'extra');
    return r;
  }
  if (sc && pre) return r;   // 평가 시작 전: 기록이 없어도 결근으로 세지 않음
  if (sc){
    const today = todayStr();
    if (ds < today) r.status = 'absent';
    else if (ds === today) r.status = now > r.sEnd ? 'absent' : now > r.sStart + grace ? 'notyet' : 'upcoming';
    else r.status = 'upcoming';
  }
  return r;
}

const isMonthly = st => st.payType === 'month';
const isEmployed = (st, ds) => (!st.hireDate || ds >= st.hireDate) && (!st.endDate || ds <= st.endDate);
function employedDays(st, ym, upto){ let n = 0; for (let d = 1; d <= daysIn(ym); d++){ const ds = `${ym}-${pad(d)}`; if ((!upto || ds <= upto) && isEmployed(st, ds)) n++; } return n; }
function dayCost(st, r, projected){
  if (isMonthly(st)) return isEmployed(st, r.ds) ? (+st.monthly || 0) / daysIn(ymOf(r.ds)) : 0;   // 월급제: 근무 기간의 날마다 월급 ÷ 그 달 일수
  const w = +st.wage||0, prem = cfg().otPremium ? 1.5 : 1;
  let min = r.paid, ot = r.ot;
  if (projected){
    if (r.status === 'upcoming' || r.status === 'notyet'){ min = r.schedMin; ot = 0; }
    else if (r.status === 'working'){ min = Math.max(r.paid, r.schedMin); }
  }
  return ((min - ot) + ot*prem) * w / 60;
}

function weekHoliday(st, sunDs, now){
  if (!cfg().weeklyHoliday || isMonthly(st)) return { eligible:false };
  let schedMin = 0, absent = false;
  for (let i = 6; i >= 0; i--){
    const r = dayCalc(st, addDays(sunDs, -i), now);
    if (r.sc) schedMin += r.schedMin;
    if (r.status === 'absent') absent = true;
  }
  if (schedMin < 900) return { eligible:false };
  const hours = Math.min(schedMin/2400, 1) * 8;
  return { eligible:true, sunDs, schedMin, absent, complete: sunDs < todayStr(), hours, amount: absent ? 0 : hours * (+st.wage||0) };
}

function deductions(st, gross){
  const R = cfg().rates, t10 = x => Math.floor(x/10)*10, map = {};
  if (st.deduct === 'biz'){ map.inc = t10(gross*0.03); map.loc = t10(map.inc*0.1); }
  else if (st.deduct === 'ins'){ map.np = t10(gross*R.np/100); map.hi = t10(gross*R.hi/100); map.ltc = t10(map.hi*R.ltc/100); map.ei = t10(gross*R.ei/100); }
  return { map, total: Object.values(map).reduce((a, b) => a + b, 0) };
}

function monthSummary(st, ym, now = Date.now()){
  const w = +st.wage||0, n = daysIn(ym);
  const o = { st, ym, workDays:0, paid:0, worked:0, ot:0, otDays:[], absentDays:[], lateDays:[], lateMin:0, earlyDays:[], leaveDays:[], restDays:[], nooutDays:[], days:[], weeks:[], holiday:0, projGross:0, otWait:0, otWaitDays:[] };
  for (let d = 1; d <= n; d++){
    const ds = `${ym}-${pad(d)}`, r = dayCalc(st, ds, now);
    o.days.push(r);
    if (WORKED.has(r.status)){ o.workDays++; o.paid += r.paid; o.worked += r.worked; }
    if (r.ot > 0){ o.otDays.push({ ds, min:r.ot }); o.ot += r.ot; }
    if (r.otWait > 0){ o.otWaitDays.push({ ds, min:r.otWait }); o.otWait += r.otWait; }   // 확인 안 한 추가근무 (급여에 안 들어감)
    if (r.status === 'absent') o.absentDays.push(ds);
    if (r.late){ o.lateDays.push({ ds, min:r.late }); o.lateMin += r.late; }
    if (r.early) o.earlyDays.push({ ds, min:r.early });
    if (r.status === 'leave') o.leaveDays.push(ds);
    if (r.status === 'off' && r.regOff && ds <= todayStr()) o.restDays.push(ds);
    if (r.status === 'noout') o.nooutDays.push(ds);
    o.projGross += dayCost(st, r, true);
    if (parseDate(ds).getDay() === 0){
      const wh = weekHoliday(st, ds, now);
      if (wh.eligible){ o.weeks.push(wh); if (wh.complete) o.holiday += wh.amount; o.projGross += wh.amount; }
    }
  }
  const prem = cfg().otPremium ? 1.5 : 1;
  o.base = Math.floor((o.paid - o.ot) * w / 60);
  o.otPay = Math.floor(o.ot * w * prem / 60);
  o.holiday = Math.floor(o.holiday);
  o.gross = o.base + o.otPay + o.holiday;
  o.projGross = Math.floor(o.projGross);
  if (isMonthly(st)){   // 월급제: 월급을 근무한 날짜 비율로 (한 달 다 일하면 월급 그대로)
    const full = Math.floor((+st.monthly || 0) * employedDays(st, ym) / n), today = todayStr();
    o.base = ym < ymOf(today) ? full : Math.floor((+st.monthly || 0) * employedDays(st, ym, today) / n);
    o.otPay = 0; o.holiday = 0; o.weeks = []; o.gross = o.base; o.projGross = full;
  }
  o.ded = deductions(st, o.gross);
  o.net = o.gross - o.ded.total;
  return o;
}

function costSeries(ym, now = Date.now()){
  const n = daysIn(ym), today = todayStr(), list = staffForMonth(ym), out = [];
  let ca = 0, cp = 0;
  for (let d = 1; d <= n; d++){
    const ds = `${ym}-${pad(d)}`, sun = parseDate(ds).getDay() === 0;
    let a = 0, p = 0;
    for (const st of list){
      const r = dayCalc(st, ds, now);
      if (ds <= today) a += dayCost(st, r, false);
      p += dayCost(st, r, true);
      if (sun){ const wh = weekHoliday(st, ds, now); if (wh.eligible){ if (wh.complete) a += wh.amount; p += wh.amount; } }
    }
    ca += a; cp += p;
    out.push({ d, ds, actual: ds <= today ? ca : null, proj: cp });
  }
  return out;
}

function openPunch(st, now = Date.now()){
  const today = todayStr();
  for (const ds of [today, addDays(today, -1)]){
    const p = getPunch(st.id, ds);
    if (p && p.in && !p.out && p.kind !== 'leave' && now - p.in < 20*3600000) return p;
  }
  return null;
}

function punchRef(staffId, ds){ return S.db.collection(`months/${ymOf(ds)}/punches`).doc(`${staffId}_${ds}`); }
function errMsg(e){
  if (e?.code === 'quota_exceeded') return '저장 공간이 가득 찼어요. 오래된 기록을 정리해야 해요.';
  if (e?.code === 'invalid_argument') return '이 계정으로는 저장할 권한이 없어요. 사장님 계정으로 로그인해 주세요.';
  return '잠시 후 다시 시도해 주세요.';
}
async function write(fn){
  if (!S.db){ toast('저장소에 연결되지 않았어요', '인터넷 연결을 확인하고 새로고침해 주세요.', 'warn'); throw new Error('nodb'); }
  try { return await fn(); }
  catch (e){
    if (e?.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { return await fn(); } catch (e2){ e = e2; } }
    toast('저장하지 못했어요', errMsg(e), 'warn'); throw e;
  }
}
function ensureMonth(ym){
  if (!S.db || S.monthSubs[ym]) return;
  S.months[ym] = S.months[ym] || new Map();
  S.monthSubs[ym] = S.db.collection(`months/${ym}/punches`).onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, { id:d.id, ...d.data() }));
    S.months[ym] = m;
    S.monthLoaded[ym] = true;
    if (!snap.metadata.fromCache) markConnected();
    if (ym === ymOf(todayStr()) || ym === shiftYM(ymOf(todayStr()), -1)) detectEvents([...m.values()]);
    scheduleRender();
  }, e => { S.monthLoaded[ym] = true; console.warn('month', ym, e); scheduleRender(); });
}
function needMonth(ym){ ensureMonth(ym); ensureMonth(shiftYM(ym, -1)); }
let connTimer = null;
function markConnected(){ if (!S.connected){ S.connected = true; S.connNote = ''; clearTimeout(connTimer); renderBanner(); } }

/* ===================== 알림 ===================== */
function beep(kind){
  if (!S.audio) return;
  try {
    const ctx = S.audio, t = ctx.currentTime;
    const tones = kind === 'late' ? [660, 440, 660] : kind === 'ok' ? [880] : [740, 990];
    tones.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, t + i*0.18); g.gain.exponentialRampToValueAtTime(0.25, t + i*0.18 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.18 + 0.16);
      o.connect(g).connect(ctx.destination); o.start(t + i*0.18); o.stop(t + i*0.18 + 0.17);
    });
  } catch {}
}
function initAudio(){ if (!S.audio){ try { S.audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } else if (S.audio.state === 'suspended') S.audio.resume().catch(()=>{}); }
function toast(title, body, tone = 'info', ms = 8000){
  if (isVi()){ title = TT(title); body = body ? TT(body) : body; }   // 직원 화면: 사전에 있는 안내는 베트남어 병기
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  el.innerHTML = `<b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}`;
  el.onclick = () => el.remove();
  $('#toasts').prepend(el);
  setTimeout(() => el.remove(), ms);
}
const ownerWatching = () => S.mode === 'owner' && S.unlocked;
function notify(title, body, tone){
  if (!ownerWatching()) return;
  toast(title, body, tone, 12000);
  if (S.sound) beep(tone);
  try { navigator.vibrate?.(tone === 'late' ? [120, 80, 120] : 80); } catch {}
}
function detectEvents(docs){
  const now = Date.now();
  for (const p of docs){
    const sig = `${p.in||''}|${p.out||''}|${p.kind||''}`;
    const prev = S.seen.get(p.id);
    S.seen.set(p.id, sig);
    if (!S.primed || prev === sig || p.edited) continue;
    const st = staffById(p.staffId), name = st?.name || p.name || '직원';
    const prevOut = prev ? prev.split('|')[1] : '';
    if (p.out && !prevOut && now - p.out < 600000){
      const r = st ? dayCalc(st, p.date, now) : null;
      notify(`${name} 퇴근`, `${fmtT(p.out)} 퇴근${r ? ` · 오늘 ${fmtH(r.worked)} 근무` : ''}`, 'info');
    } else if (p.in && !prev && now - p.in < 600000){
      const late = p.lateMin || 0;
      notify(late ? `${name} 지각 출근` : `${name} 출근`, `${fmtT(p.in)} 출근${p.sched ? ` · 예정 ${p.sched.start}` : ''}${late ? ` · ${late}분 늦음` : ''}`, late ? 'late' : 'ok');
    }
  }
  S.primed = true;
}
function checkNotyet(){
  if (!ownerWatching()) return;
  const today = todayStr(), now = Date.now(), fresh = [];
  for (const st of activeStaff()){
    const r = dayCalc(st, today, now), key = `${st.id}_${today}`;
    if (r.status === 'notyet' && !S.notified.has(key)){ S.notified.add(key); fresh.push({ st, r }); }
  }
  if (!fresh.length) return;
  store.set('notified', JSON.stringify({ d:today, k:[...S.notified] }));
  if (fresh.length > 2) notify(`${fresh.length}명 아직 미출근`, fresh.map(f => f.st.name).join(', '), 'late');
  else fresh.forEach(f => notify(`${f.st.name} 지각 의심`, `예정 ${f.r.sc.start}인데 아직 출근 기록이 없어요`, 'late'));
}
function loadNotified(){ try { const o = JSON.parse(store.get('notified') || 'null'); if (o && o.d === todayStr()) S.notified = new Set(o.k); } catch {} }

/* ===================== 휴대폰 메일 알림 =====================
   가게 태블릿(출퇴근 화면)이 사장님 Gmail로 보내요. 사장님 화면을 닫아 둬도 태블릿만 켜져 있으면 돼요. */
let mcpP = null;
const getMcp = () => mcpP || (mcpP = window.tcStore?.use ? window.tcStore.use('mcp') : Promise.resolve(null));
const mailAddrs = to => String(to || '').split(/[\s,;]+/).filter(x => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
function mailErrText(e){
  switch (e?.code){
    case 'server_not_connected': return 'claude.ai 설정 → 커넥터에서 Gmail을 연결해 주세요.';
    case 'needs_reauth': return 'Gmail 연결이 끊겼어요. claude.ai 설정 → 커넥터에서 Gmail을 다시 연결해 주세요.';
    case 'selection_required': return 'Gmail 계정이 여러 개라 고르는 창이 떴어요. 태블릿에서 계정을 골라 주세요.';
    case 'approval_required': case 'not_in_manifest': case 'consent_required': return '태블릿에서 메일 보내기를 아직 허락하지 않았어요. 태블릿에서 ‘시험 메일 보내기’를 눌러 허락해 주세요.';
    case 'blocked_by_policy': return '계정 정책 때문에 Gmail로 보낼 수 없어요.';
    case 'tool_error': return 'Gmail이 보내기를 거절했어요. 받는 주소를 확인해 주세요.';
    case 'server_unavailable': case 'upstream_error': case 'rate_limited': return 'Gmail에 잠시 연결되지 않았어요. 인터넷을 확인해 주세요.';
    case 'not_granted': case 'capability_disabled': case 'capability_removed': return '메일 보내기는 아직 준비 중이에요.';
    default: return e?.message || '알 수 없는 문제로 보내지 못했어요.';
  }
}
async function sendMail(subject, lines, opt = {}){
  const m = opt.mail || cfg().mail, to = mailAddrs(m.to);
  if (!opt.test && !(m.on && S.mode === 'kiosk')) return null;
  const title = `[${cfg().storeName}] ${subject}`;
  const log = (ok, err) => S.db?.doc('status/mail').set({ at:Date.now(), ok, subject:title, err: err || '' }).catch(() => {});
  if (!to.length){ const err = '받을 메일 주소가 없어요. 설정에서 넣어 주세요.'; if (!opt.test) log(false, err); return { ok:false, err }; }
  const mcp = await getMcp();
  if (!mcp){ const err = mailErrText({ code:'not_granted' }); log(false, err); return { ok:false, err }; }
  try {
    const input = { to, subject:title, body: [...lines, '', '— 가게 타임카드 자동 알림 (끄기: 사장님 화면 → 현황 → 메일 알림 끄기)'].join('\n') };
    if (opt.photo) input.attachments = [{ content: await blobB64(opt.photo.blob), filename: opt.photo.name, mimeType:'image/jpeg' }];
    await mcp.callTool('Gmail', 'send_message', input, { cache:false });
    log(true); return { ok:true };
  } catch (e){ const err = mailErrText(e); log(false, err); return { ok:false, err }; }
}

function stampPhoto(src, w0, h0, st, kind, t, geo){

  const gl = geoLine(geo), u = Math.max(w, h*0.75) / 20, up = gl ? u : 0, band = u*6 + up;

  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.78)');
  g.fillStyle = grd; g.fillRect(0, h - band, w, band);

  g.font = `600 ${Math.round(u*2.1)}px "IBM Plex Mono", monospace`; g.fillText(fmtClock(t), u*0.8, h - u*2.5 - up);
  g.font = `600 ${Math.round(u*0.85)}px "IBM Plex Sans KR", sans-serif`;
  g.fillText(fmtDateLong(ymd(new Date(t))), u*0.8, h - u*1.45 - up);
  g.fillText(`${cfg().storeName} · ${st.name} · ${kind === 'in' ? '출근' : '퇴근'}`, u*0.8, h - u*0.5 - up);

    while (fs > u*0.5 && g.measureText('📍 ' + gl).width > w - u*1.6){ fs -= u*0.05; g.font = `600 ${Math.round(fs)}px "IBM Plex Sans KR", sans-serif`; }
    if (geo?.out) g.fillStyle = '#ffb4a8';
    g.fillText('📍 ' + gl, u*0.8, h - u*0.5);

}

function schedSummary(sched){
  const groups = new Map();
  for (const i of WEEK_ORDER){ const s = sched?.[i]; if (s && s.on){ const k = `${s.start}–${s.end}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(DAYS[i]); } }
  if (!groups.size) return '정해진 근무 없음';
  const rest = WEEK_ORDER.filter(i => !(sched?.[i]?.on)).map(i => DAYS[i]);
  return [...groups].map(([k, d]) => `${d.join('·')} ${k}`).join(' / ') + (rest.length ? ` · ${rest.join('·')} 정기 휴무` : '');
}

function earlyBird(extra){
  const today = todayStr();
  let best = null;
  for (const st of activeStaff()){
    const p = getPunch(st.id, today), inMs = extra?.sid === st.id ? extra.in : p?.in;
    const sc = schedFor(st, today, p);
    if (!inMs || !sc || p?.kind === 'leave') continue;
    const min = Math.round((at(today, sc.start) - inMs) / 60000);
    if (min >= 1 && (!best || min > best.min || (min === best.min && inMs < best.in))) best = { sid:st.id, min, in:inMs };
  }

}

  if (tp && tp.out) return { cls:'done', text: tp.in ? TV('출근 {a} · 퇴근 {b}', { a:fmtT(tp.in), b:fmtT(tp.out) }) : TV('퇴근 {t}', { t:fmtT(tp.out) }) };   // 오늘 출근 시각은 모두에게 (v33)

const earlyDays = o => o.days.filter(r => evalOn(r.ds) && r.p?.in && r.sStart && r.p.in <= r.sStart - 60000).map(r => ({ ds:r.ds, min:Math.round((r.sStart - r.p.in) / 60000) }));
function earlyStreak(o){   // 가장 최근 근무날부터 거꾸로, 연속으로 일찍 온 근무날 수 (정해진 근무가 없는 날·휴무는 건너뜀, 오늘 아직 안 왔으면 어제부터)
  let n = 0;
  const today = todayStr();
  for (const r of [...o.days].reverse()){

}

function buildFeed(today, now){
  const items = [];
  for (const st of staffForDay(today)){
    const p = getPunch(st.id, today), r = dayCalc(st, today, now);
    if (p && p.in) items.push({ t:p.in, cls: r.late ? 'late' : '', text:`<b>${esc(st.name)}</b> 출근${r.late ? ` — ${r.late}분 지각 (예정 ${r.sc.start})` : ''}` });
    if (p && p.out) items.push({ t:p.out, cls:'', text:`<b>${esc(st.name)}</b> 퇴근 — ${fmtH(r.worked)} 근무${r.early ? ` · ${r.early}분 일찍` : ''}` });
    if (r.status === 'notyet') items.push({ t:r.sStart + cfg().graceMin*60000, cls:'wait', text:`<b>${esc(st.name)}</b> 아직 출근 기록 없음 (예정 ${r.sc.start}) — 지각 의심` });
    if (r.status === 'absent') items.push({ t:r.sEnd, cls:'late', text:`<b>${esc(st.name)}</b> 오늘 근무 시간이 끝났는데 출근 기록이 없어요 (결근)` });
    const y = addDays(today, -1), ry = dayCalc(st, y, now);
    if (ry.status === 'noout') items.push({ t:ry.p.in, cls:'wait', text:`<b>${esc(st.name)}</b> 어제 퇴근 기록이 없어요 → ‘출퇴근 기록’에서 고쳐 주세요` });
    const yp = getPunch(st.id, y);
    if (yp && yp.out && ymd(new Date(yp.out)) === today) items.push({ t:yp.out, cls:'', text:`<b>${esc(st.name)}</b> 퇴근 (어제 시작한 근무)` });
  }
  return items.sort((a, b) => b.t - a.t);
}

  } else if (sub === 'month'){
    needMonth(S.month);
    nav = monthNav();

    for (let m = 1; m <= 12; m++) needMonth(`${S.year}-${pad(m)}`);

function monthNav(){ return `<div class="nav"><button data-act="monthShift" data-v="-1" aria-label="이전 달">‹</button><b>${fmtYM(S.month)}</b><button data-act="monthShift" data-v="1" aria-label="다음 달">›</button></div>`; }

      <td>${statusChips(r)}</td>

function cellOf(r){
  switch (r.status){
    case 'done': return r.late ? ['c-late', (r.paid/60).toFixed(1)] : ['c-done', (r.paid/60).toFixed(1)];
    case 'working': return ['c-extra', '근무'];
    case 'extra': return ['c-extra', (r.paid/60).toFixed(1)];
    case 'absent': return ['c-absent', '결'];
    case 'notyet': return ['c-wait', '미'];
    case 'noout': return ['c-wait', '누락'];
    case 'leave': return ['c-leave', '휴'];
    case 'upcoming': return ['c-sched', '·'];
    default: return r.regOff ? ['c-rest', '휴무'] : ['c-off', ''];
  }
}
function monthGrid(ym){
  if (!S.monthLoaded[ym]) return loadingNote();
  const now = Date.now(), n = daysIn(ym), list = staffForMonth(ym);
  if (!list.length) return `<div class="empty">이 달에 기록된 직원이 없어요.</div>`;
  const head = Array.from({ length:n }, (_, i) => { const ds = `${ym}-${pad(i+1)}`, w = parseDate(ds).getDay(); return `<th class="${w === 0 || w === 6 ? 'we' : ''}">${i+1}<br>${DAYS[w]}</th>`; }).join('');
  const body = list.map(st => {
    const o = monthSummary(st, ym, now);
    return `<tr><td class="name">${esc(st.name)}</td>${o.days.map(r => { const [c, t] = cellOf(r); return `<td class="${c}"><button data-act="gotoDay" data-ds="${r.ds}" title="${r.ds}">${t}</button></td>`; }).join('')}
      <td class="tot">${fmtH(o.paid)}<div class="small muted">결근 ${o.absentDays.length} · 지각 ${o.lateDays.length}</div></td></tr>`;
  }).join('');
  return `<section class="panel"><div class="tscroll"><table class="mgrid"><thead><tr><th class="name">직원</th>${head}<th>합계</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i class="c-done"></i>정상 (숫자 = 인정 시간)</span><span><i class="c-late"></i>지각</span><span><i class="c-absent"></i>결근</span><span><i class="c-extra"></i>추가 근무 / 근무 중</span><span><i class="c-wait"></i>미출근·퇴근 누락</span><span>휴무 = 정기 휴무(근무표에서 쉬는 요일)</span><span>휴 = 근무일을 휴무 처리</span><span><i class="c-sched"></i>예정</span></div>
    <p class="hint">날짜 칸을 누르면 그날 기록을 보고 고칠 수 있어요.</p></section>`;
}
function yearTable(y){
  const months = Array.from({ length:12 }, (_, i) => `${y}-${pad(i+1)}`);
  if (!months.every(m => S.monthLoaded[m])) return loadingNote();
  const now = Date.now(), ids = new Set();
  months.forEach(m => staffForMonth(m).forEach(s => ids.add(s.id)));
  const list = S.staff.filter(s => ids.has(s.id));
  if (!list.length) return `<div class="empty">이 해에 기록된 직원이 없어요.</div>`;
  const tot = months.map(() => ({ min:0, pay:0 }));
  const rows = list.map(st => {
    let tm = 0, tp = 0;
    const cells = months.map((m, i) => {
      const o = monthSummary(st, m, now);
      tm += o.paid; tp += o.gross; tot[i].min += o.paid; tot[i].pay += o.gross;
      return o.paid || o.gross ? `<td class="r mono">${fmtHM(o.paid)}<div class="small muted">${num(o.gross)}</div></td>` : '<td class="r muted">—</td>';
    }).join('');
    return `<tr><td><b>${esc(st.name)}</b></td>${cells}<td class="r mono"><b>${fmtHM(tm)}</b><div class="small">${won(tp)}</div></td></tr>`;
  }).join('');
  const all = tot.reduce((a, t) => ({ min:a.min + t.min, pay:a.pay + t.pay }), { min:0, pay:0 });
  return `<section class="panel"><div class="tscroll"><table class="t"><thead><tr><th>직원</th>${months.map((m, i) => `<th class="r">${i+1}월</th>`).join('')}<th class="r">합계</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td>합계</td>${tot.map(t => `<td class="r mono">${t.min ? fmtHM(t.min) : '—'}<div class="small">${t.pay ? num(t.pay) : ''}</div></td>`).join('')}<td class="r mono">${fmtHM(all.min)}<div class="small">${won(all.pay)}</div></td></tr></tfoot></table></div>
    <p class="hint">위 숫자 = 인정 근무시간(시:분), 아래 숫자 = 그달 지급총액(원, 공제 전).</p></section>`;
}

function timecardView(){

  if (!S.monthLoaded[S.month] || !S.ready.staff) return head + loadingNote();
  const now = Date.now(), list = staffForMonth(S.month);

function niceMax(v){ if (v <= 0) return 100000; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

function chartSVG(series){

  [1, 5, 10, 15, 20, 25, n].filter((d, i, a) => d <= n && a.indexOf(d) === i && !(d !== n && n - d < 3)).forEach(d => { g += `<text x="${x(d)}" y="${H - 10}" text-anchor="middle">${d}일</text>`; });
  const act = series.filter(s => s.actual != null);
  if (act.length){
    const pts = act.map(s => `${x(s.d)},${y(s.actual)}`).join(' ');
    g += `<polygon class="area" points="${x(1)},${y(0)} ${pts} ${x(act[act.length-1].d)},${y(0)}"/><polyline class="act" points="${pts}"/>`;
  }
  const lastA = act[act.length - 1];
  const projPts = series.filter(s => !lastA || s.d >= lastA.d).map(s => `${x(s.d)},${y(s.d === lastA?.d ? lastA.actual : s.proj)}`).join(' ');
  if (!lastA || lastA.d < n) g += `<polyline class="proj" points="${projPts}"/>`;
  if (lastA && lastA.d < n) g += `<line class="today" x1="${x(lastA.d)}" x2="${x(lastA.d)}" y1="${T - 10}" y2="${H - B}"/><text x="${x(lastA.d)}" y="${T - 14}" text-anchor="middle" style="fill:var(--amber)">오늘</text>`;

/* ===================== 전자 근로계약서 =====================

const INS = [['emp','고용보험'],['acc','산재보험'],['np','국민연금'],['hi','건강보험']];

function contractsOf(sid){ return S.contracts.filter(c => c.staffId === sid).sort((a, b) => (b.ver || 0) - (a.ver || 0)); }
function currentContract(sid){ return contractsOf(sid)[0] || null; }

function defaultTerms(st){

  await write(() => S.db.doc('contracts/' + id).set(doc));

async function contractHash(c){

}

/* ---------- 서명판 ---------- */
const SIG = {};
function sigPad(id, hint = '여기에 손가락으로 서명해 주세요'){
  return `<div class="sigwrap"><canvas id="${id}" class="sigpad" aria-label="${hint}"></canvas><span class="sighint">${hint}</span>
    <button type="button" class="btn sm sigclr" data-act="sigClear" data-id="${id}">${TV('다시 쓰기')}</button></div>`;
}
function initSigs(){ document.querySelectorAll?.('canvas.sigpad').forEach(c => initSig(c)); }
function initSig(c){
  if (c.dataset.ready) return;
  c.dataset.ready = '1';
  const id = c.id, r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  const g = c.getContext('2d');
  g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111';
  SIG[id] = { n:0 };
  let down = false, lx = 0, ly = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener('pointerdown', e => { down = true; try { c.setPointerCapture(e.pointerId); } catch {} [lx, ly] = pos(e); g.beginPath(); g.arc(lx, ly, 1.3, 0, 7); g.fill(); SIG[id].n++; c.parentNode.classList.add('signed'); S.kiosk.at = Date.now(); e.preventDefault(); });
  c.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.stroke(); lx = x; ly = y; SIG[id].n++; e.preventDefault(); });
  const up = () => { down = false; };

async function kioskSign(){
  const k = S.kiosk, c = S.contracts.find(x => x.id === k.contractId);
  if (!c || k.busy) return;
  const addr = $('#k-addr').value.trim(), phone = $('#k-phone').value.trim(), email = mailAddrs($('#k-email').value)[0] || '';
  if (!addr || !phone){ toast('주소와 연락처를 넣어 주세요', '계약서에 들어가는 내용이에요.', 'warn'); return; }
  if (!$('#k-agree').checked){ toast('동의 칸에 체크해 주세요', '', 'warn'); return; }
  const sig = sigData('sig-emp');
  if (!sig){ toast('서명을 해 주세요', '네모 칸에 손가락으로 이름을 써 주세요.', 'warn'); return; }
  k.busy = true; const btn = document.querySelector?.('[data-act="kSign"]'); if (btn){ btn.disabled = true; btn.textContent = '저장하는 중…'; }
  const upd = { emp:{ addr, phone, email }, empSign:sig, empSignedAt:Date.now(), tpl: contractTpl(c) };
  if (cfg().contract.autoOwnerSign && S.ownerSign) Object.assign(upd, ownerSignFields());
  try {
    if (upd.ownerSign) upd.hash = await contractHash({ ...c, ...upd });
    await write(() => S.db.doc('contracts/' + c.id).update(upd));
    Object.assign(c, upd);
    k.result = { kind:'contract', t:upd.empSignedAt, late:false, msg: upd.ownerSign ? '근로계약서 서명이 끝났어요. 사본은 사장님께 받으세요.' : '서명했어요. 사장님 서명까지 되면 계약이 완료돼요.' };
    k.step = 'done'; k.at = Date.now(); beep('ok');
  } catch {}
  k.busy = false; render(true);
}

/* ===================== 세무사 전달용 급여 내역 =====================
   월말에 세무사 사무실에 보내던 문자를 자동으로 정리해요. 4대보험 가입자 / 미가입(인건비 신고자)로 나누고,
   세전 급여·입사일(·퇴사일·주민번호)만 담아요. 금액은 보내기 전에 고칠 수 있어요. */
const RRN_RE = /^(\d{6})-?(\d{7})$/;
const maskRrn = r => { const m = RRN_RE.exec(r || ''); return m ? `${m[1]}-${m[2][0]}******` : ''; };
const fmtYYMD = ds => { if (!ds) return ''; const d = parseDate(ds); return `${String(d.getFullYear()).slice(2)}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const prevYM = () => shiftYM(ymOf(todayStr()), -1);
function reportRows(ym){
  const now = Date.now(), ongoing = ym >= ymOf(todayStr()), rep = S.reports[ym] || {}, first = `${ym}-01`, last = `${ym}-${pad(daysIn(ym))}`;
  return staffForMonth(ym).filter(st => !st.sample && (!st.hireDate || st.hireDate <= last) && (!st.endDate || st.endDate >= first)).map(st => {
    const o = monthSummary(st, ym, now), calc = ongoing ? o.projGross : o.gross;
    const amount = rep.amounts?.[st.id] ?? calc;
    const newHire = !!st.hireDate && st.hireDate >= first && st.hireDate <= last;
    const withRrn = !!st.rrn && (rep.rrn?.[st.id] ?? newHire);
    return { st, o, calc, amount: Math.round(+amount || 0), edited: rep.amounts?.[st.id] != null && +rep.amounts[st.id] !== calc, ins: st.deduct === 'ins', newHire, withRrn,
      left: st.endDate && st.endDate >= first && st.endDate <= last ? st.endDate : '' };
  }).filter(r => r.amount > 0 || r.o.workDays);
}
function reportText(ym, rows = reportRows(ym), mask = false){
  const [y, m] = ym.split('-'), rep = S.reports[ym] || {};
  const block = list => list.length ? list.map((r, i) => `${i + 1}. ${r.st.name}: 입사일 ${fmtYYMD(r.st.hireDate) || '(입사일 없음)'}${r.left ? ` / 퇴사일 ${fmtYYMD(r.left)}` : ''}${r.withRrn ? `\n${mask ? maskRrn(r.st.rrn) : r.st.rrn}` : ''}\n(급여: [세전] ${num(r.amount)}원)`).join('\n\n') : '(없음)';
  return `안녕하세요. ${y.slice(2)}년 ${+m}월 급여내역 보내드립니다.

<4대보험 가입자 급여신고자>

${block(rows.filter(r => r.ins))}

<4대보험 미가입 인건비 신고자>

${block(rows.filter(r => !r.ins))}${rep.note ? `\n\n참고: ${rep.note}` : ''}

- ${cfg().biz.name || cfg().storeName} 드림`;
}
function reportCSV(ym, rows = reportRows(ym)){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ['번호','구분','성명','입사일','퇴사일','주민등록번호','세전 급여(원)','급여 방식','근무일수','인정 근무시간'];
  const lines = rows.sort((a, b) => b.ins - a.ins).map((r, i) => [i + 1, r.ins ? '4대보험 가입' : '4대보험 미가입', r.st.name, r.st.hireDate || '', r.left, r.withRrn ? r.st.rrn : '', r.amount,
    isMonthly(r.st) ? `월급 ${r.st.monthly}` : `시급 ${r.st.wage}`, r.o.workDays, (r.o.paid / 60).toFixed(2)].map(q).join(','));
  return '﻿' + [head.join(','), ...lines].join('\r\n');
}

async function sendReport(ym, auto){

  if (!to.length) return { ok:false, err:'세무사 메일 주소가 없어요' };
  const rows = reportRows(ym), [y, m] = ym.split('-');
  const mcp = await getMcp();
  if (!mcp) return { ok:false, err: mailErrText({ code:'not_granted' }) };
  try {
    await mcp.callTool('Gmail', 'send_message', { to, subject:`[${cfg().biz.name || cfg().storeName}] ${y.slice(2)}년 ${+m}월 급여내역`, body: reportText(ym, rows),
      attachments:[{ content: await blobB64(new Blob([reportCSV(ym, rows)], { type:'text/csv' })), filename:`급여내역_${ym}.csv`, mimeType:'text/csv' }] }, { cache:false });

/* ===================== 전체 백업 =====================
   저장소의 모든 기록을 파일 하나(.json)로 받아요. 출퇴근 기록은 엑셀(.csv)로도 받을 수 있어요.
   사진은 파일이 커서 넣지 않고, 사진 번호(id)만 기록에 남아요. */
let backupBusy = false;
function backupMonths(){   // 가장 이른 입사일·기록 달부터 이번 달까지 (최대 10년)
  const cur = ymOf(todayStr());
  let from = cur;
  for (const st of S.staff) if (st.hireDate && ymOf(st.hireDate) < from) from = ymOf(st.hireDate);
  for (const ym of Object.keys(S.months)) if (S.months[ym].size && ym < from) from = ym;
  const out = [];
  for (let ym = from; ym <= cur && out.length < 120; ym = shiftYM(ym, 1)) out.push(ym);
  return out;
}
async function readAllPunches(onStep, kind = 'punches'){   // kind: 'punches' 출퇴근 / 'task_reports' 업무 보고
  const out = {};
  const months = backupMonths();
  for (let i = 0; i < months.length; i++){
    const ym = months[i];
    onStep?.(i + 1, months.length);
    const snap = await S.db.collection(`months/${ym}/${kind}`).limit(1000).get();
    if (snap.docs.length) out[ym] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }
  return out;
}
const backupStamp = () => { const d = new Date(); return `${ymd(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
function backupLine(){
  const b = S.backupStatus;
  if (!b?.at) return '<span style="color:var(--amber)">아직 백업한 적이 없어요.</span>';
  const days = Math.floor((Date.now() - b.at) / 86400000);
  const when = `${fmtMD(ymd(new Date(b.at)))} ${fmtT(b.at)}`;

/* ===================== 위치 확인 =====================
   가게 위치를 한 번 저장해 두고, 출퇴근 때 태블릿 위치와의 거리를 재요.
   사진에는 등록한 가게 주소와 거리를 새겨요. (claude.ai에서는 지도 API를 쓸 수 없었어요.
   Supabase 서버 함수로 카카오 로컬 API를 붙이면 실제 도로명 주소를 넣을 수 있어요 → docs/결정사항.md ⑬ '나중에 개선할 것') */
function getPos(timeout){
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ code:0 });
    try { navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy:true, timeout, maximumAge:60000 }); } catch (e){ rej(e); }
  });
}
function geoErrText(e){ return e?.code === 1 ? '위치 사용이 막혀 있음' : e?.code === 2 ? '위치를 찾지 못함' : e?.code === 3 ? '시간 초과' : '위치 기능 없음'; }
function distM(a1, o1, a2, o2){
  const r = Math.PI / 180, dA = (a2 - a1) * r, dO = (o2 - o1) * r;
  const x = Math.sin(dA / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
  return 6371000 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
const fmtDist = m => m < 1000 ? `${Math.round(m)}m` : `${(m / 1000).toFixed(1)}km`;
function geoInfo(p, st){
  const g = cfg().geo, lat = p.coords.latitude, lng = p.coords.longitude, acc = Math.round(p.coords.accuracy || 0);
  const dist = g.lat != null ? Math.round(distM(lat, lng, g.lat, g.lng)) : null;
  const far = dist != null && dist - acc > (+g.radius || 200);
  return st?.geoExempt ? { lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc, dist, out:false, ex:true, far }   // 외근 직원: 가게 밖이어도 문제로 보지 않음
    : { lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc, dist, out: far };
}
function startGeo(){ const k = S.kiosk, st = staffById(k.staffId); k.geoP = cfg().geo.on ? getPos(8000).then(p => geoInfo(p, st), e => ({ err: geoErrText(e) })) : null; }
async function geoNow(){
  if (!cfg().geo.on) return null;
  const k = S.kiosk;
  if (!k.geoP) startGeo();
  return Promise.race([k.geoP, new Promise(r => setTimeout(() => r({ err:'시간 초과' }), 9000))]);
}
function geoLine(geo){
  if (!geo) return '';
  if (geo.err) return `위치 확인 안 됨 (${geo.err})`;
  if (geo.ex && geo.far) return `외근 · ${geo.lat}, ${geo.lng} (가게에서 ${fmtDist(geo.dist)})`;
  if (geo.dist == null) return `현재 위치 ${geo.lat}, ${geo.lng}`;
  if (geo.out) return `가게 밖 · 가게에서 ${fmtDist(geo.dist)} (${geo.lat}, ${geo.lng})`;
  return `${cfg().biz.addr || cfg().storeName} (가게에서 ${fmtDist(geo.dist)}${geo.acc > 50 ? ` · 오차 ±${geo.acc}m` : ''})`;
}
function geoChip(geo, word){
  if (!geo) return '';
  if (geo.err) return `<span class="chip faint" title="${esc(geo.err)}">${word} 위치 없음</span>`;
  if (geo.out) return `<span class="chip red" title="${geo.lat}, ${geo.lng} · 오차 ±${geo.acc}m">${word} 가게 밖 ${fmtDist(geo.dist)}</span>`;
  if (geo.ex && geo.far) return `<span class="chip faint" title="${geo.lat}, ${geo.lng} · 외근 직원이라 문제로 보지 않아요">${word} 외근 ${fmtDist(geo.dist)}</span>`;
  return '';
}
const geoCsv = geo => !geo ? '' : geo.err ? '확인 안 됨' : geo.dist != null ? `가게에서 ${geo.dist}m${geo.out ? ' (가게 밖)' : geo.ex && geo.far ? ' (외근)' : ''}` : `${geo.lat} ${geo.lng}`;
const GACT = {
  async geoToggle(){
    const g = cfg().geo;
    await write(() => S.db.doc('config/main').set({ ...S.config, geo:{ ...g, on:!g.on } }));
    toast(g.on ? '위치 확인을 껐어요' : '위치 확인을 켰어요', g.on ? '' : g.lat == null ? '가게에서 태블릿으로 ‘지금 위치를 가게 위치로 저장’을 눌러 주세요.' : '출퇴근할 때 가게와의 거리가 기록돼요.', 'ok');
    render(true);
  },
  async geoSet(){
    toast('위치를 찾고 있어요', '잠시만 기다려 주세요. 위치 사용을 묻는 창이 뜨면 ‘허용’을 눌러 주세요.', 'info');
    try {
      const p = await getPos(15000), acc = Math.round(p.coords.accuracy || 0);
      await write(() => S.db.doc('config/main').set({ ...S.config, geo:{ ...cfg().geo, lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc, setAt:Date.now() } }));
      toast('가게 위치를 저장했어요', acc > 100 ? `오차가 ±${acc}m로 커요. 창가에서 한 번 더 눌러 보세요.` : `오차 ±${acc}m`, acc > 100 ? 'warn' : 'ok');
    } catch (e){ toast('위치를 가져오지 못했어요', geoErrText(e) + ' — 크롬에서 열고 위치 사용을 허용해 주세요.', 'warn'); }
    render(true);
  }
};

/* ===================== 업무 지시·사진 보고 (개발 요청서 3번) =====================
   기준 화면: 시험판 task-report-demo.html (v3). 사장님이 지시·공지를 올리면 직원은 출근 때 공지를 확인하고,
   업무 사진은 자기 휴대폰(직원 휴대폰 화면, 주소 끝 #phone)으로 찍어 보내요. 사장님은 [확인] 또는 [다시 해 주세요].
   저장 (tc_docs)
     tasks/{id}                                         지시·공지 { kind:'task'|'notice', title, body, refPhotos[], target{mode:'all'|'pos'|'staff', pos, ids[]},
                                                          repeat:'once'|'daily'|'days', days[], due:'HH:MM', minPhotos, active, start, createdAt }
     task_reads/{taskId}_{staffId}                      읽음 { taskId, staffId, at, where:'tablet'|'phone' }
     months/{YYYY-MM}/task_reports/{taskId}_{staffId}_{날짜}  보고 { taskId, staffId, date, photos[], note, sentAt, status:'sent'|'ok'|'redo', ownerNote, round, oldPhoto, checkedAt }
   - '아직'·'마감 지남'은 저장하지 않고 화면에서 계산해요.
   - 직원은 지금 개인 번호로 구분해요. 나중에 직원 계정을 열면 문서마다 있는 staffId로 서버 규칙을 붙이면 돼요 (화면·데이터는 그대로).
   - 사진: 업무 보고 → tc-photos/work (60일 지나면 지움), 참고 사진 → tc-photos/taskref (storage.js FOLDERS) */
const WORK_PHOTO_DAYS = 60;
const TR_STATUS = { ok:['ok','확인 완료'], sent:['blue','확인 대기'], redo:['red','다시 요청함'], late:['red','마감 지남'], todo:['amber','아직'] };
const taskById = id => S.tasks.find(t => t.id === id);
const trKey = (taskId, staffId, ds) => `${taskId}_${staffId}_${ds}`;
const trCol = ym => `months/${ym}/task_reports`;
const trRef = (ds, key) => S.db.collection(trCol(ymOf(ds))).doc(key);
function getRep(taskId, staffId, ds){ return S.trep[ymOf(ds)]?.get(trKey(taskId, staffId, ds)); }
const positions = () => [...new Set(activeStaff().map(s => s.position).filter(Boolean))];
const deviceMode = () => store.get('device') === 'phone' ? 'phone' : 'kiosk';
function assignees(t){
  const tg = t.target || { mode:'all' }, list = activeStaff();
  if (tg.mode === 'pos') return list.filter(s => s.position === tg.pos);
  if (tg.mode === 'staff') return list.filter(s => (tg.ids || []).includes(s.id));
  return list;
}
function targetText(t){
  const tg = t.target || { mode:'all' };
  if (tg.mode === 'pos') return `${tg.pos} 전체`;
  if (tg.mode === 'staff') return assignees(t).map(s => s.name).join(', ') || '담당 없음';
  return '전체 직원';
}
function repeatText(t){
  if (t.repeat === 'daily') return '매일';
  if (t.repeat === 'days') return (t.days || []).length ? WEEK_ORDER.filter(d => t.days.includes(d)).map(d => DAYS[d]).join('·') + '요일' : '요일 미정';
  return `${fmtMD(t.start || todayStr())} 하루`;
}
function appliesOn(t, ds){
  if (t.kind !== 'task' || !t.start || ds < t.start) return false;
  if (t.repeat === 'daily') return true;

}
// 그날 그 직원의 보고 상태: ok 확인 완료 / sent 확인 대기 / redo 다시 요청 / late 마감 지남 / todo 아직
function trStatus(t, st, ds){
  const r = getRep(t.id, st.id, ds);
  if (r) return { s:r.status || 'sent', r };
  const today = todayStr();
  if (ds < today || (ds === today && t.due && Date.now() > at(ds, t.due))) return { s:'late' };
  return { s:'todo' };
}
// 읽음: '고쳐서 다시 올리기'(repostAt) 뒤에 읽은 것만 읽음으로 셈 (v36)
const isRead = (t, st) => { const r = S.treads.get(`${t.id}_${st.id}`); return !!r && (!t.repostAt || (+r.at || 0) >= t.repostAt); };
const postedAt = t => t.repostAt || t.createdAt || 0;   // 목록 순서·첫 화면 날짜: 다시 올린 시각이 있으면 그것
const liveTasks = () => S.tasks.filter(t => t.active !== false).sort((a, b) => postedAt(b) - postedAt(a));
const mineAll = st => liveTasks().filter(t => assignees(t).some(a => a.id === st.id));
const unreadFor = st => S.ready.tasks && S.ready.treads ? mineAll(st).filter(t => !isRead(t, st)) : [];
const todayTasksFor = st => mineAll(st).filter(t => appliesOn(t, todayStr()));
const unsentFor = st => todayTasksFor(st).filter(t => ['todo', 'late', 'redo'].includes(trStatus(t, st, todayStr()).s));
function trWaiting(){
  const out = [];
  for (const m of Object.values(S.trep)) for (const [id, r] of m) if ((r.status || 'sent') === 'sent') out.push({ id, ...r });
  return out.sort((a, b) => (b.sentAt || 0) - (a.sentAt || 0));
}

function ensureTR(ym){
  if (!S.db || S.trSubs[ym]) return;
  S.trep[ym] = S.trep[ym] || new Map();
  S.trSubs[ym] = S.db.collection(trCol(ym)).onSnapshot(snap => {
    const next = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (S.trPrimed[ym]) for (const [k, r] of next){   // 새로 들어온 보고 알림 (사장님 화면을 열어 둔 동안)
      const old = S.trep[ym].get(k);
      if ((r.status || 'sent') === 'sent' && (!old || old.sentAt !== r.sentAt)) notify(`${staffById(r.staffId)?.name || '직원'}님 업무 보고 도착`, taskById(r.taskId)?.title || '', 'ok');
    }
    S.trep[ym] = next; S.trLoaded[ym] = true; S.trPrimed[ym] = true; scheduleRender();
  }, e => { S.trLoaded[ym] = true; console.warn('task_reports', ym, e); scheduleRender(); });
}
function needTR(ym){ ensureTR(ym); ensureTR(shiftYM(ym, -1)); }

// ----- 사진: 줄이기·시각/이름/업무 새기기 (긴 변 1280px, JPEG 0.82 — 시험판과 같음) -----
async function toJpeg(file, label){
  const im = await loadImage(file), t0 = Date.now();
  const w0 = im.width || im.naturalWidth, h0 = im.height || im.naturalHeight;
  const sc = Math.min(1, 1280 / Math.max(w0, h0)), w = Math.round(w0 * sc), h = Math.round(h0 * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, w, h);
  if (label){
    const u = Math.max(w, h * 0.75) / 22, band = u * 5.2;
    const grd = g.createLinearGradient(0, h - band, 0, h); grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.78)');
    g.fillStyle = grd; g.fillRect(0, h - band, w, band);
    g.fillStyle = '#fff';
    g.font = `600 ${Math.round(u * 1.9)}px "IBM Plex Mono", monospace`; g.fillText(fmtT(t0), u * 0.7, h - u * 2.4);
    const tw = g.measureText(fmtT(t0)).width;
    g.font = `500 ${Math.round(u * 0.8)}px "IBM Plex Sans KR", sans-serif`; g.fillText(fmtDateLong(ymd(new Date(t0))), u * 0.7 + tw + u * 0.5, h - u * 2.5);
    let fs = u * 0.85;
    g.font = `600 ${Math.round(fs)}px "IBM Plex Sans KR", sans-serif`;
    while (fs > u * 0.5 && g.measureText(label).width > w - u * 1.4){ fs -= u * 0.05; g.font = `600 ${Math.round(fs)}px "IBM Plex Sans KR", sans-serif`; }
    g.fillText(label, u * 0.7, h - u * 0.9);
  }
  const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82));
  return { blob, url: URL.createObjectURL(blob), old: !!(file.lastModified && t0 - file.lastModified > 10 * 60000) };   // 찍은 지 10분 넘은 사진 = 앨범 사진일 수 있음
}
async function uploadWork(blob, prefix){
  const a = await getAssets();
  if (!a) throw Object.assign(new Error('사진 저장을 쓸 수 없는 화면이에요'), { code:'no_assets' });
  for (let i = 0; ; i++){
    try { return (await a.upload(blob, { type:'image/jpeg', prefix })).id; }
    catch (e){ if (e?.code === 'store_unavailable' && i === 0){ await new Promise(r => setTimeout(r, 900)); continue; } throw e; }
  }
}

}

function readTForm(){
  const f = S.tform, fm = $('#trForm');
  if (!f || !fm || !fm.querySelector) return;
  const val = sel => fm.querySelector(sel)?.value;
  const all = sel => [...(fm.querySelectorAll(sel) || [])].map(i => i.value);
  f.kind = val('input[name=tkind]:checked') || 'task';
  f.title = $('#trTitle')?.value ?? f.title; f.body = $('#trBody')?.value ?? f.body;
  f.pinned = f.kind === 'notice' && !!$('#trPin')?.checked;
  f.titleVi = $('#trTitleVi')?.value ?? f.titleVi; f.bodyVi = $('#trBodyVi')?.value ?? f.bodyVi;
  if (f.editId && $('#trRenotify')) f.renotify = !!$('#trRenotify').checked;   // 고치기: 직원에게 다시 알리기
  // 담당: 이름을 하나라도 고르면 그 직원들만, 아니면 전체 / 담당별 (화면에서는 한쪽을 고르면 다른 쪽이 풀림)
  const tg = val('input[name=tgt]:checked') || 'all', ids = all('input[name=tids]:checked');
  f.target = ids.length ? { mode:'staff', ids } : tg.startsWith('pos:') ? { mode:'pos', pos: tg.slice(4), ids:[] } : { mode:'all', ids:[] };
  if (f.kind === 'task'){
    f.repeat = val('input[name=trep]:checked') || 'daily';
    f.days = all('input[name=tdays]:checked').map(Number);
    f.due = $('#trDue')?.value ?? f.due; f.minPhotos = +($('#trMin')?.value || 1);
  }
}

    S.tform = null; S.editing = null; render(true); return;

    ...(f.kind === 'task' ? { repeat:f.repeat, days:f.days, due:f.due, minPhotos:f.minPhotos } : { pinned: !!f.pinned }) };

  S.tform = null; S.editing = null; render(true);

async function addRefFiles(files){
  const f = S.tform; if (!f) return;
  readTForm();

  if (!imgs.length) return;
  f.uploading = true; render(true);
  try { for (const file of imgs){ const j = await toJpeg(file, ''); URL.revokeObjectURL(j.url); f.refPhotos.push(await uploadWork(j.blob, 'r_')); } }
  catch (e){ toast('사진을 올리지 못했어요', e?.code === 'no_assets' ? e.message : '잠시 후 다시 해 주세요.', 'warn'); }
  finally { f.uploading = false; render(true); }
}

     확정하면 가게 태블릿·직원 휴대폰 첫 화면에 축하 공고 (한국어·베트남어). 직원은 자기 점수와 우수직원만 볼 수 있어요.

function scoreMonth(st, ym, now = Date.now()){

  let clean = true, any = false, weekHad = false, weekClean = true;
  for (let d = 1; d <= n; d++){
    const ds = `${ym}-${pad(d)}`;
    if (ds > today) break;
    if (!evalOn(ds)) continue;   // 평가 시작 전 (시험 기간)
    const r = dayCalc(st, ds, now), p = r.p;
    if (r.sc && r.status !== 'leave'){
      if (p?.in || r.status === 'absent'){   // 출근했거나 결근으로 끝난 날만 (오늘 아직 안 온 건 계산 안 함)
        any = true; weekHad = true; o.possible += SCORE.onTime;
        if (p?.in && !r.late){ o.earned += SCORE.onTime; o.att.ontime++; o.streak++; if (o.streak % SCORE.streakEvery === 0) o.b.streak += SCORE.streak; }
        else { o.streak = 0; clean = false; weekClean = false; p?.in ? o.att.late++ : o.att.absent++; }
        o.best = Math.max(o.best, o.streak);
      }
      if (r.status === 'done'){ o.possible += SCORE.done; o.earned += SCORE.done; o.att.done++; }
      else if (r.status === 'absent' || r.status === 'noout') o.possible += SCORE.done;
    } else if (!r.sc && p?.in && p.kind !== 'leave') o.b.extra += SCORE.extra;   // 쉬는 날 도와준 근무
    if (parseDate(ds).getDay() === 0){ if (weekHad && weekClean) o.b.week += SCORE.week; weekHad = false; weekClean = true; }
  }
  if (ym < ymOf(today) && any && clean) o.b.month += SCORE.month;
  const mine = S.tasks.filter(t => assignees(t).some(a => a.id === st.id));
  for (const t of mine.filter(t => t.kind === 'task')){
    for (let d = 1; d <= n; d++){
      const ds = `${ym}-${pad(d)}`;
      if (ds > today) break;
      if (!evalOn(ds) || !appliesOn(t, ds)) continue;
      const rep = getRep(t.id, st.id, ds), dueAt = at(ds, t.due || '23:59');
      if (!rep && ds === today && now <= dueAt) continue;   // 오늘 마감 전이면 아직 계산 안 함
      o.possible += SCORE.taskOnTime + SCORE.taskOk;
      if (!rep){ o.task.missed++; continue; }
      if (rep.sentAt && rep.sentAt <= dueAt){ o.earned += SCORE.taskOnTime; o.task.sent++; } else { o.earned += SCORE.taskLate; o.task.late++; }
      if (rep.status === 'ok'){ o.earned += SCORE.taskOk; o.task.ok++; }
    }
  }
  for (const t of mine.filter(t => t.createdAt && ymOf(ymd(new Date(t.createdAt))) === ym)){
    o.possible += SCORE.read; o.readPossible++;
    if (isRead(t, st)){ o.earned += SCORE.read; o.read++; }
  }
  o.b.praise = S.praise.filter(x => x.staffId === st.id && x.ym === ym).reduce((s, x) => s + (+x.pts || 0), 0);
  o.bonus = o.b.streak + o.b.week + o.b.month + o.b.extra + o.b.praise;
  o.total = o.earned + o.bonus;
  o.rate = o.possible ? o.earned / o.possible : null;
  return o;
}

function readTm(){   // 팀 목표 입력칸 → S.tmDraft (화면에 있는 칸만)
  const D = S.tmDraft || (S.tmDraft = { kind:'ontime', period:'month' }), v = id => $('#' + id) ? $('#' + id).value : undefined;
  if ($('#tmOn')) D.on = !!$('#tmOn').checked;
  for (const [id, k] of [['tmTarget', 'target'], ['tmTitle', 'title'], ['tmGoal', 'goal'], ['tmUnit', 'unit'], ['tmCur', 'current'], ['tmFrom', 'from'], ['tmTo', 'to'], ['tmReward', 'reward']]){ const x = v(id); if (x !== undefined) D[k] = x; }
}
async function setAtt(sid, patch){   // 업무태도: 지금 값(방법·별점·직접 가중치)을 모두 남기고 바뀐 것만
  const ym = S.month;
  if (S.awards[ym]) return;   // 확정한 달은 바꾸지 않음
  const i = attInfo(sid, ym), att = { ...(cfg().award.att || {}) };
  att[ym] = { ...(att[ym] || {}), [sid]: { mode:i.mode, ...i.stars, w:i.manualW, ...patch } };
  await putConfig({ ...S.config, award:{ ...cfg().award, att } });
  S.awForm = null; render(true);
}

      team.title = (D.title || '').trim().slice(0, 40); team.goal = Math.max(1, Math.round(+D.goal || 0)); team.unit = (D.unit || '').trim().slice(0, 6); team.current = Math.max(0, Math.round(+D.current || 0));

/* ===================== 추가근무 요청·승인 (v27) ===================== */
// ot/{staffId}_{YYYY-MM-DD} — 직원·날짜당 한 개
//   { staffId, date, kind:'pre'(먼저 요청) | 'post'(먼저 하고 보고), status:'pending' | 'approved' | 'rejected',
//     reqMin(요청·보고한 분), okMin(승인된 분, 먼저 받은 승인 포함), until(요청한 퇴근 시각), reason, note, noteKo(직원 한마디 한국어 번역),

// 승인제(config ot.on)를 켠 날(ot.since)부터: 정해진 시간을 넘긴 근무는 승인된 만큼만 급여에 들어가요 (dayCalc → r.ot / r.otWait 확인 대기 / r.otNo 불인정).
//   - 먼저 요청: 직원이 언제든 요청 → 사장님 [승인] / [시간 바꿔 승인] / [거절]. 답이 없는 채로 더 일하면 퇴근할 때 '먼저 하고 보고'로 바뀜
//   - 먼저 하고 보고: 퇴근할 때 승인으로 덮이지 않은 추가근무가 인정 단위(기본 10분) 이상이면 이유를 물어봄. 건너뛰어도 사장님께 '보고 없음'으로 보임
//   - 확인 안 한 추가근무는 급여에 넣지 않음 (대표님 결정 2026-11-20). 근무 집계·인건비 화면에 '확인 안 한 추가근무'를 띄워 빠뜨리지 않게 함
//   - 정해진 근무가 없는 날(휴무일 근무)은 예전처럼 전부 추가근무 (승인 대상 아님)
const OT_REASONS = [['busy', '🍽 손님 많음'], ['close', '🧹 마감 청소'], ['prep', '🦪 재료 손질'], ['cover', '🙋 동료 대신'], ['etc', '✏️ 기타']];
const OT_MINS = [30, 60, 90, 120];
function otApplies(ds){ const o = cfg().ot; return !!o.on && !!o.since && ds >= o.since; }
function otDoc(sid, ds){ return S.ots.get(`${sid}_${ds}`); }
const otRef = (sid, ds) => S.db.collection('ot').doc(`${sid}_${ds}`);
const otIdParts = id => [id.slice(0, -11), id.slice(-10)];   // {직원}_{YYYY-MM-DD}
const addHM = (hm, min) => { const [h, m] = String(hm || '0:0').split(':').map(Number), t = (((h * 60 + m + min) % 1440) + 1440) % 1440; return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };
const otMinKo = m => m < 60 ? `${m}분` : fmtH(m);
const otMinS = m => !isVi() ? otMinKo(m) : m < 60 ? `${m} phút` : fmtHvi(m);
// {h}에 시간을 넣는 문구: 베트남어 줄엔 베트남어 시간, 아래 한국어 줄엔 한국어 시간
const TH = (key, m) => BI(fillT(key, { h:otMinKo(m) }), fillT(VI[key] || key, { h: m < 60 ? `${m} phút` : fmtHvi(m) }));
const otReasonKo = c => OT_REASONS.find(x => x[0] === c)?.[1] || '';
// 직원이 요청할 수 있는 날: 승인제 적용 중 + 그날 정해진 근무가 있음 + 아직 퇴근 전
function otDayFor(st, now = Date.now()){ const op = openPunch(st, now); return op ? op.date : todayStr(); }
function otCanRequest(st, now = Date.now()){
  const ds = otDayFor(st, now), p = getPunch(st.id, ds);
  return otApplies(ds) && !!schedFor(st, ds, p) && !(p && p.out);
}
// 직원 화면: 오늘 요청·보고 상태 한 줄
function otStaffLine(st, ds = otDayFor(st)){
  const o = otDoc(st.id, ds);
  if (!o || !otApplies(ds)) return '';
  const lab = o.status === 'approved' ? (o.kind === 'pre' && o.until ? T('✅ 추가근무 승인됨 · 퇴근 {t}', { t:o.until }) : TH('✅ 추가근무 {h} 인정됐어요', o.okMin || 0))
    : o.status === 'rejected' ? (o.kind === 'pre' ? T('❌ 추가근무 요청이 거절됐어요 · 정해진 시간에 퇴근해 주세요') : T('❌ 추가근무가 인정되지 않았어요'))
    : o.kind === 'pre' ? T('⏳ 추가근무 요청 · 사장님 답을 기다리는 중') : T('⏳ 추가근무 보고 · 사장님 확인을 기다리는 중');
  return `<div class="otline ${o.status}">${lab}${o.ownerNote ? `<div class="small">${TV('사장님')}: ${ownerNoteHtml(o)}</div>` : ''}</div>`;
}
const otReasonBtns = f => `<div class="row otreasons">${OT_REASONS.map(([c, l]) => `<button class="btn sm ${f.reason === c ? 'pri' : ''}" data-act="otWhy" data-v="${c}" aria-pressed="${f.reason === c}">${TV(l)}</button>`).join('')}</div>`;
const otNoteField = f => `<label class="f">${T('한마디 (선택)')}<input type="text" id="otNote" maxlength="80" value="${esc(f.note || '')}" placeholder="${esc(TV('예) 단체 손님 예약 20명'))}"></label>`;

function otReqView(st, clock){

    <div class="row otmins">${OT_MINS.map(m => `<button class="btn ${f.min === m ? 'pri' : ''}" data-act="otMin" data-v="${m}" aria-pressed="${f.min === m}">+${otMinS(m)}</button>`).join('')}</div>

    <div class="small muted">${T('이유를 골라 주세요')}</div>${otReasonBtns(f)}${otNoteField(f)}
    <button class="bigbtn" data-act="otSend" ${f.min && f.reason && !f.busy ? '' : 'disabled'}>${T('사장님께 요청 보내기')}</button>

// 퇴근 직후: 먼저 하고 보고 (step 'ot')
function otPostView(st, clock){

// 태블릿 출근·퇴근 화면과 직원 휴대폰 첫 화면: 오늘 상태 + [추가근무 요청]
function otKioskBit(st){
  if (!otCanRequest(st)) return '';
  const o = otDoc(st.id, otDayFor(st));
  return `<div class="otbit">${otStaffLine(st)}<button class="btn otbtn" data-act="otOpen">${TV(o ? '⏱ 추가근무 다시 요청' : '⏱ 추가근무 요청')}</button></div>`;

const otKeepNote = () => { if (S.otForm) S.otForm.note = ($('#otNote')?.value ?? S.otForm.note ?? '').trim(); };
async function saveOtStaff(){
  const f = S.otForm, st = f && staffById(f.staffId);
  if (!st || f.busy || !f.reason || (f.mode === 'pre' && !f.min)) return;
  f.busy = true; render(true);
  const id = `${st.id}_${f.ds}`, o = otDoc(st.id, f.ds), sc = schedFor(st, f.ds, getPunch(st.id, f.ds));
  const noteKo = f.note && !hasHangul(f.note) ? (await tryTranslate([f.note], 'ko'))?.[0] || '' : '';   // 베트남어 한마디 → 사장님용 한국어
  const base = { staffId:st.id, date:f.ds, reason:f.reason, note:f.note, noteKo, at:Date.now(), via: S.mode === 'phone' ? 'phone' : 'tablet', ownerNote:'', ownerNoteVi:'', decidedAt:null };
  const doc = f.mode === 'pre'
    ? { ...base, kind:'pre', status:'pending', reqMin:f.min, until: sc ? addHM(sc.end, f.min) : '', okMin: o?.status === 'approved' ? o.okMin || 0 : 0 }
    : { ...base, kind:'post', status:'pending', reqMin:f.extra, until:'', okMin:f.okMin || 0, ...(o ? { pre:{ kind:o.kind, status:o.status, reqMin:o.reqMin || 0, okMin:o.okMin || 0, at:o.at || 0 } } : {}) };
  S.ots.set(id, doc);
  await write(() => otRef(st.id, f.ds).set(doc));

  toast(f.mode === 'pre' ? '⏱ 사장님께 추가근무를 요청했어요' : '⏱ 추가근무 이유를 보냈어요', '', 'ok');

// ----- 사장님: 확인할 추가근무 -----
// 대기 중인 요청·보고 + 실제로 더 일했는데 확인 안 된 날(보고 없음 포함, 이번 달·지난달)
function otQueue(now = Date.now()){
  const c = cfg().ot;
  if (!c.on || !c.since) return [];
  const out = new Map(), today = todayStr();
  for (const [id, o] of S.ots) if (o.status === 'pending' && o.date >= c.since) out.set(id, { id, o });
  for (const ym of [shiftYM(ymOf(today), -1), ymOf(today)]){
    if (!S.monthLoaded[ym] || !S.months[ym]) continue;
    for (const p of S.months[ym].values()){
      if (!p.in || !p.out || p.date < c.since) continue;
      const st = staffById(p.staffId); if (!st) continue;
      const r = dayCalc(st, p.date, now);
      if (r.otWait > 0){ const id = `${st.id}_${p.date}`; out.set(id, { id, o:otDoc(st.id, p.date), r }); }
    }
  }
  return [...out.values()].map(it => { const [sid, ds] = otIdParts(it.id), st = staffById(sid); return { ...it, sid, ds, st, r: it.r || (st && getPunch(sid, ds)?.in ? dayCalc(st, ds, now) : null) }; })
    .filter(it => it.st).sort((a, b) => (a.ds < b.ds ? 1 : a.ds > b.ds ? -1 : (a.o?.at || 0) - (b.o?.at || 0)));
}
function otRow(it){
  const { id, o, r, st, ds } = it, sc = r?.sc || schedFor(st, ds, getPunch(st.id, ds));
  const worked = !!(r && r.otRaw), post = worked || o?.kind === 'post';
  const kind = !o ? ['보고 없음', 'amber'] : o.kind === 'pre' && !worked ? ['미리 요청', 'blue'] : o.kind === 'pre' ? ['미리 요청 · 답 전에 더 일함', 'amber'] : ['먼저 하고 보고', 'amber'];
  const sug = worked ? r.otRaw : (o?.reqMin || 0);
  const ed = S.otEdit?.id === id ? S.otEdit : null;
  const lines = [

async function ownerOtDecide(id, status, min, note = ''){
  const [sid, ds] = otIdParts(id), st = staffById(sid);
  if (!st) return;
  const o = otDoc(sid, ds), r = getPunch(sid, ds)?.in ? dayCalc(st, ds) : null, worked = !!(r && r.otRaw);
  const vi = note ? (await tryTranslate([note], 'vi'))?.[0] || '' : '';   // 직원 화면에 베트남어로
  const doc = { ...(o || { staffId:sid, date:ds, reqMin: r?.otRaw || 0, reason:'', note:'', noteKo:'', until:'', at:Date.now(), via:'owner' }),
    kind: worked ? 'post' : (o?.kind || 'pre'), status,
    okMin: status === 'approved' ? Math.max(0, Math.round(min)) : (o?.kind === 'post' ? o.okMin || 0 : 0),
    ownerNote:note, ownerNoteVi:vi, decidedAt:Date.now() };
  if (worked){ doc.reqMin = r.otRaw; if (o?.kind === 'pre') doc.pre = { kind:o.kind, status:o.status, reqMin:o.reqMin || 0, okMin:o.okMin || 0, at:o.at || 0 }; }
  S.ots.set(id, doc);
  await write(() => otRef(sid, ds).set(doc));
  S.otEdit = null; if (S.editing === 'otEdit') S.editing = null;
  toast(status === 'approved' ? `${st.name} 추가근무 ${otMinKo(doc.okMin)} 승인` : `${st.name} 추가근무 ${worked || o?.kind === 'post' ? '불인정' : '거절'}`, status === 'approved' ? '급여에 들어가요.' : '', 'ok');
  render(true);
}
const OTACT = {
  otOpen(){

  otEditCancel(){ S.otEdit = null; if (S.editing === 'otEdit') S.editing = null; render(true); },

const siteOrigin = () => location.origin && location.origin !== 'null' ? location.origin : 'https://timecard.dajoba.kr';

function isPhoneAcct(){ try { return window.tcStore?.userRole?.() === 'phone'; } catch { return false; } }

let joinReq = null;
function joinFor(st){
  const j = S.join;
  if (j && j.staffId === st.id && (j.code ? j.exp - Date.now() > 60000 : j.err)) return j;   // 1분 넘게 남았거나, 실패했으면 그대로
  if (joinReq?.sid === st.id) return j && j.staffId === st.id ? j : null;
  if (!window.tcStore?.invoke) return null;
  const sid = st.id;
  joinReq = { sid };
  S.join = { staffId:sid, busy:true };
  window.tcStore.invoke('tc-phone-join', { action:'issue', staffId:sid })
    .then(r => { if (S.join?.staffId === sid) S.join = r?.code ? { staffId:sid, code:r.code, exp:+r.exp || Date.now() + 600000 } : { staffId:sid, err:r?.error || '코드를 받지 못했어요' }; })
    .catch(e => { if (S.join?.staffId === sid) S.join = { staffId:sid, err:e?.message || String(e) }; console.warn('phone join', e?.message || e); })
    .finally(() => { if (joinReq?.sid === sid) joinReq = null; if (S.kiosk.step === 'phonereq') render(true); });
  return S.join;
}
const joinUrl = code => `${siteOrigin()}/#join=${code}`;

async function savePhoneLink(sid){   // 휴대폰 연결·접속 기록

}
const plinkBeat = {};
function phoneHeartbeat(st){   // 직원 휴대폰 화면을 열면 하루 한 번
  const old = S.plinks.get(st.id);

// QR: 이 안내가 보일 때만 QR 그리는 작은 도구를 불러옴 (안 되면 주소만)
const qrCache = {}; let qrLoading = false;
function qrSvg(text){
  if (qrCache[text]) return qrCache[text];
  if (typeof window.qrcode === 'function'){ try { const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return (qrCache[text] = q.createSvgTag(6, 2)); } catch { return ''; } }
  if (!qrLoading && document.head && document.head.appendChild){
    qrLoading = true;
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; sc.onload = () => render(true); sc.onerror = () => console.warn('QR 도구를 불러오지 못했어요');
    document.head.appendChild(sc);
  }
  return '';
}

function padPress(ctx, v){
  if (ctx === 'owner'){
    if (v === 'cancel'){ S.lockPin = ''; S.lockErr = ''; ACT.toKiosk(); return; }
    S.lockPin = v === 'back' ? S.lockPin.slice(0, -1) : (S.lockPin + v).slice(0, 4);
    S.lockErr = '';
    if (S.lockPin.length === 4){
      if (S.lockPin === String(cfg().ownerPin)){ S.unlocked = true; if (S.remember) store.set('ownerDevice', '1'); S.lockPin = ''; checkNotyet(); }
      else { S.lockErr = '번호가 맞지 않아요'; S.lockPin = ''; }
    }
    render(true); return;
  }
  if (ctx === 'phone'){   // 직원 휴대폰 처음 연결: 이름 고른 뒤 개인 번호
    const P = S.phone, st = staffById(P.pickId);
    if (v === 'cancel'){ Object.assign(P, { pickId:null, pin:'', err:'' }); render(true); return; }
    P.pin = v === 'back' ? P.pin.slice(0, -1) : (P.pin + v).slice(0, 4);
    P.err = '';
