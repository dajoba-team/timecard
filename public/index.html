async function saveConfig(){
  const pin = $('#c-pin').value.trim();
  if (!/^\d{4}$/.test(pin)){ toast('관리 번호는 숫자 4자리로 넣어 주세요', '', 'warn'); return; }
  const master = $('#c-master').value.trim();
  if (master && !/^\d{4}$/.test(master)){ toast('마스터 번호는 숫자 4자리로 넣어 주세요', '쓰지 않으려면 칸을 비워 두세요.', 'warn'); return; }
  const clash = master && activeStaff().find(s => String(s.pin) === master);
  if (clash){ toast('마스터 번호가 직원 번호와 같아요', `${clash.name}님의 개인 번호와 겹쳐요. 다른 번호로 정해 주세요.`, 'warn'); return; }
  const doc = { storeName: $('#c-name').value.trim() || '우리 가게', ownerPin: pin, masterPin: master,
    graceMin: Math.max(0, Math.round(+$('#c-grace').value || 0)), otUnit: Math.max(1, Math.round(+$('#c-unit').value || 1)),
    earlyClamp: $('#c-early').checked, otPremium: $('#c-prem').checked, weeklyHoliday: $('#c-hol').checked,
    rates:{ np:+$('#c-np').value || 0, hi:+$('#c-hi').value || 0, ltc:+$('#c-ltc').value || 0, ei:+$('#c-ei').value || 0 },
    mail: readMailForm(), photo:{ ...cfg().photo, on: $('#p-on').checked } };
  if (doc.mail.on && !mailAddrs(doc.mail.to).length){ toast('받을 메일 주소를 넣어 주세요', '메일 알림을 켜려면 주소가 필요해요.', 'warn'); return; }
  await write(() => S.db.doc('config/main').set({ ...S.config, ...doc }));
  toast('설정을 저장했어요', '', 'ok');
  S.editing = null; render(true);
}
function readMailForm(){
  return { on: $('#m-on').checked, to: mailAddrs($('#m-to').value).join(', '),
    ev:{ in: $('#m-in').checked, late: $('#m-late').checked, notyet: $('#m-notyet').checked, out: $('#m-out').checked } };
}
async function clearSamples(){
  const ids = new Set(S.staff.filter(s => s.sample).map(s => s.id));
  let n = 0;
  for (const ym of Object.keys(S.months)) for (const p of [...S.months[ym].values()]) if (ids.has(p.staffId)){ await write(() => S.db.doc(`months/${ym}/punches/${p.id}`).delete()); n++; }
  for (const id of ids) await write(() => S.db.doc('staff/' + id).delete());
  toast('예시 데이터를 지웠어요', `직원 ${ids.size}명 · 기록 ${n}건`, 'ok');
  render(true);
}
async function saveFile(filename, data){
  const dl = window.tcStore?.use ? await window.tcStore.use('downloads') : null;
  if (!dl){ toast('이 화면에서는 파일 저장을 쓸 수 없어요', '대신 ‘표 복사’로 엑셀에 붙여 넣어 주세요.', 'warn'); return; }
  try { await dl.save({ filename, data }); toast('파일을 저장했어요', filename, 'ok'); return true; }
  catch (e){ if (e?.code !== 'declined') toast('저장하지 못했어요', e?.message || '', 'warn'); }
}
function copyText(text, title = '복사했어요', body = '카카오톡이나 메모에 붙여 넣으세요.'){
  const fallback = () => {
    const m = $('#modal');
    m.innerHTML = `<div class="box"><h3 style="margin-bottom:8px">아래 내용을 길게 눌러 복사하세요</h3><textarea id="copyBox" readonly>${esc(text)}</textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="closeModal">닫기</button></div></div>`;
    m.hidden = false; const ta = $('#copyBox'); ta.focus(); ta.select();
    $('#closeModal').onclick = () => { m.hidden = true; };
  };
  try { navigator.clipboard.writeText(text).then(() => toast(title, body, 'ok'), fallback); } catch { fallback(); }
}
let wake = null;
function requestWake(){ if (S.mode !== 'kiosk' || wake) return; try { navigator.wakeLock?.request('screen').then(w => { wake = w; w.addEventListener('release', () => { wake = null; }); }).catch(() => {}); } catch {} }

/* ===================== 시계 · 시작 ===================== */
let lastDay = todayStr();
function tick1(){
  const now = Date.now();
  const t = $('#ktime'); if (t) t.textContent = fmtClock(now);
  const ct = $('#camtime'); if (ct) ct.textContent = fmtClock(now);
  const k = S.kiosk;
  if (S.mode === 'kiosk' && k.step !== 'list' && !k.busy){
    const idle = now - (k.at || now);
    if ((k.step === 'done' && idle > 6000) || idle > (k.step === 'contract' ? 300000 : 30000)){ resetKiosk(); render(true); }
  }
  if (todayStr() !== lastDay){
    lastDay = todayStr(); S.notified = new Set(); S.mailed = new Set();
    const ym = ymOf(lastDay); needMonth(ym);
    const kd = $('#kdate'); if (kd) kd.textContent = fmtDateLong(lastDay);
    scheduleRender();
  }
}
function tick30(){
  checkNotyet();
  checkNotyetMail().catch(err => console.warn(err));
  autoReport().catch(err => console.warn(err));
  if (S.mode === 'owner' && S.unlocked && ['now','payroll'].includes(S.tab)) render(false);
  else if (S.mode === 'kiosk' && S.kiosk.step === 'list') render(false);
  else renderTop();
}
async function boot(){
  const h = (location.hash || '').slice(1);
  S.mode = h === 'kiosk' ? 'kiosk' : TABS.some(t => t[0] === h) ? 'owner' : (store.get('mode') || 'kiosk');
  S.tab = TABS.some(t => t[0] === h) ? h : (store.get('tab') || 'now');
  S.unlocked = S.mode === 'owner' && store.get('ownerDevice') === '1';
  loadNotified(); loadMailed();
  S.pending = window.tcStore?.pendingCount?.() || 0;
  window.addEventListener?.('tc-pending', e => { S.pending = e.detail || 0; renderBanner(); if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); });
  render(true);
  setInterval(tick1, 1000);
  setInterval(tick30, 30000);
  connTimer = setTimeout(() => { if (!S.connected && !S.noDb){ S.connNote = '저장소 응답을 기다리고 있어요. 인터넷 연결을 확인해 주세요.'; renderBanner(); } }, 10000);
  const db = window.tcStore?.use ? await window.tcStore.use('db') : null;
  if (!db){ clearTimeout(connTimer); S.noDb = true; S.ready.staff = true; render(true); return; }
  S.db = db;
  db.doc('config/main').onSnapshot(s => { S.config = s.exists ? s.data() : {}; S.ready.config = true; if (!s.metadata.fromCache) markConnected(); scheduleRender(); }, e => console.warn('config', e));
  db.collection('staff').onSnapshot(s => {
    S.staff = s.docs.map(d => ({ id:d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), 'ko'));
    S.ready.staff = true; if (!s.metadata.fromCache) markConnected(); scheduleRender();
  }, e => { S.ready.staff = true; console.warn('staff', e); scheduleRender(); });
  db.collection('contracts').onSnapshot(s => { S.contracts = s.docs.map(d => ({ id:d.id, ...d.data() })); S.ready.contracts = true; scheduleRender(); }, e => { S.ready.contracts = true; console.warn('contracts', e); scheduleRender(); });
  db.collection('reports').onSnapshot(s => { S.reports = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); S.ready.reports = true; scheduleRender(); }, e => { S.ready.reports = true; console.warn('reports', e); });
  db.doc('config/sign').onSnapshot(s => { const d = s.exists ? s.data().data : ''; S.ownerSign = SIG_RE.test(d || '') ? d : ''; scheduleRender(); }, e => console.warn('sign', e));
  db.doc('status/backup').onSnapshot(s => { S.backupStatus = s.exists ? s.data() : null; if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); }, e => console.warn('backup', e));
  db.doc('status/alert').onSnapshot(s => { S.alertStatus = s.exists ? s.data() : null; if (S.mode === 'owner') scheduleRender(); }, e => console.warn('alert', e));
  db.doc('status/mail').onSnapshot(s => { S.mailStatus = s.exists ? s.data() : null; if (S.mode === 'owner') scheduleRender(); }, e => console.warn('mail', e));
  needMonth(ymOf(todayStr()));
}
boot();
</script>
