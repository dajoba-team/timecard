<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="타임카드">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F0F2F5">
<title>가게 타임카드</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="storage.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 페이지에 두 모드 — 가게 태블릿용 '출퇴근 화면'(큰 시계 + 이름 버튼 + 번호 패드)과 사장님용 관리 화면(탭).
   타임카드 펀치 잉크(파랑 = 정상, 빨강 = 지각)를 상태색의 기본으로 삼는다. */
:root{
  --paper:#F0F2F5; --card:#FFFFFF; --ink:#151B24; --muted:#5E6774; --line:#DADFE7; --soft:#E8ECF1;
  --stamp:#2A3FC7; --stamp-soft:#E3E7FB; --red:#C4302A; --red-soft:#FBE5E3;
  --green:#1D7A4E; --green-soft:#E0F2E8; --amber:#A05D00; --amber-soft:#FBEED6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1217; --card:#161B22; --ink:#E7EBF1; --muted:#97A1AF; --line:#2A313B; --soft:#1E242D;
  --stamp:#8391FF; --stamp-soft:#1E2444; --red:#FF6E64; --red-soft:#3A1D1B;
  --green:#4FC48B; --green-soft:#132E20; --amber:#F2A73D; --amber-soft:#33260F; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E1217; --card:#161B22; --ink:#E7EBF1; --muted:#97A1AF; --line:#2A313B; --soft:#1E242D;
  --stamp:#8391FF; --stamp-soft:#1E2444; --red:#FF6E64; --red-soft:#3A1D1B;
  --green:#4FC48B; --green-soft:#132E20; --amber:#F2A73D; --amber-soft:#33260F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:36px;height:36px;border-radius:8px;border:2px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;transform:rotate(-6deg)}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;order:3;width:100%;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;position:relative}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-style:normal;margin-left:6px;font-weight:600}
@media (min-width:900px){.tabs{order:0;width:auto}}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

#banner:not(:empty){margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--amber-soft);color:var(--amber);font-size:14px}
main{padding-top:18px}

/* panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 small{color:var(--muted);font-weight:400;font-size:13px}
.cols{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.cols{grid-template-columns:3fr 2fr}}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:20px;margin-right:auto}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.stat b{font-size:22px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.stat.red b{color:var(--red)} .stat.amber b{color:var(--amber)} .stat.blue b{color:var(--stamp)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--stamp-soft);color:var(--stamp)}
.chip.faint{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.working{background:var(--stamp)} .dot.done{background:var(--green)} .dot.late{background:var(--red)} .dot.wait{background:var(--amber)}

/* tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.t td.r,.t th.r{text-align:right}
.t tr.edit td{background:var(--soft)}
.t .late{color:var(--red);font-weight:600}
.t tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* month grid */
.mgrid{border-collapse:separate;border-spacing:2px;font-size:12px}
.mgrid th{font-weight:500;color:var(--muted);padding:2px;text-align:center;min-width:34px}
.mgrid th.name{text-align:left;min-width:84px;position:sticky;left:0;background:var(--card);z-index:1}
.mgrid th.we{color:var(--red)}
.mgrid td{text-align:center;height:34px;border-radius:6px;background:var(--soft);font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:0 2px}
.mgrid td.name{text-align:left;background:var(--card);font-family:var(--f-body);font-weight:600;position:sticky;left:0;z-index:1;padding-right:8px;white-space:nowrap}
.mgrid td.tot{background:transparent;font-weight:600;white-space:nowrap;padding:0 8px}
.mgrid td button{all:unset;cursor:pointer;display:block;width:100%;height:100%;line-height:34px}
.c-done{background:var(--green-soft)!important;color:var(--green)}
.c-late{background:var(--red-soft)!important;color:var(--red);font-weight:600}
.c-absent{background:var(--red)!important;color:#fff;font-weight:600}
.c-wait{background:var(--amber-soft)!important;color:var(--amber)}
.c-extra{background:var(--stamp-soft)!important;color:var(--stamp)}
.c-leave{color:var(--muted)}
.c-sched{color:var(--muted);background:transparent!important;border:1px dashed var(--line)}
.c-off{background:transparent!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--stamp);color:#fff}
.nav{display:inline-flex;align-items:center;gap:6px}
.nav b{min-width:120px;text-align:center}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px}

/* kiosk */
.kclock{text-align:center;padding-block:18px 8px}
.kdate{color:var(--muted);font-size:16px}
.ktime{font-size:clamp(48px,11vw,96px);font-weight:600;letter-spacing:.02em;line-height:1.1}
.khint{text-align:center;color:var(--muted);margin:6px 0 18px}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));max-width:960px;margin:0 auto}
.kname{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-height:110px}
.kname:hover{border-color:var(--stamp)}
.kname b{font-size:20px}
.kname small{grid-column:2;color:var(--muted);font-size:13px}
.kname em{grid-column:1/3;font-style:normal;font-size:13px;margin-top:8px;font-family:var(--f-mono);color:var(--muted)}
.kpanel{max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.kpanel h2{font-size:24px}
.kpanel p{color:var(--muted);margin:6px 0 0}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:24px;font-family:var(--f-mono);font-weight:600}
.pad button.fn{font-size:15px;font-family:var(--f-body);color:var(--muted)}
.pad button:active{background:var(--stamp-soft)}
.err{color:var(--red)!important;font-weight:600}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bigbtn{width:100%;height:84px;border-radius:14px;border:0;font-size:26px;font-weight:700;color:#fff;background:var(--stamp);margin-top:18px}
.bigbtn.out{background:var(--ink);color:var(--card)}
.bigbtn:disabled{opacity:.5}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:14px;padding:6px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;margin-top:14px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camstamp{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;text-align:left;font-size:13px}
.camstamp b{display:block;font-family:var(--f-mono);font-size:32px;line-height:1.1}
.cammsg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px}
.filebtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn input{display:none}
.taxtext{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;line-height:1.65;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:8px 0 0;max-height:420px;overflow:auto}
.taxset{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.taxset label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.taxset label.check{display:flex;align-items:center;gap:6px}
.taxset input[type=text],.taxset input:not([type]){border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;color:var(--ink);min-width:240px}
.inlnum{width:130px;text-align:right;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px;color:var(--ink);font-family:var(--f-mono)}
.form.pt-m .pt-hour{display:none}
.form:not(.pt-m) .pt-month{display:none}
.kpanel.wide{max-width:780px;text-align:left}
.kpanel.wide h2,.kpanel.wide > p{text-align:center}
.contract{font-size:14px;line-height:1.7;color:var(--ink)}
.contract h1{font-size:20px;text-align:center;letter-spacing:.15em;margin:4px 0 14px}
.contract .terms{padding-left:20px;margin:8px 0}
.contract .terms li{margin:6px 0}
.contract .terms ul{padding-left:18px;margin:2px 0}
.contract table.ct{border-collapse:collapse;margin:6px 0;width:100%;font-size:13px}
.contract table.ct th,.contract table.ct td{border:1px solid var(--line);padding:3px 6px;text-align:center}
.contract table.ct thead th{background:var(--soft)}
.contract .cdate{text-align:center;margin:14px 0}
.contract .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contract .parties h4{margin:0 0 4px}
.contract .parties p{margin:2px 0}
.contract .meta{margin-top:16px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
@media (max-width:560px){.contract .parties{grid-template-columns:1fr}}
.cbox{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper);margin:14px 0}
.ksign{margin-top:6px}
.sigline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sig{height:48px;max-width:170px;background:#fff;border-radius:4px}
.sig.sigsm{height:36px;vertical-align:middle}
.sigph{color:var(--muted)}
.sigwrap{position:relative;margin-top:14px}
.sigpad{display:block;width:100%;height:170px;touch-action:none;background:#fff;border:2px dashed var(--line);border-radius:10px;cursor:crosshair}
.sighint{position:absolute;left:0;right:0;top:72px;text-align:center;color:#999;pointer-events:none;font-size:15px}
.sigwrap.signed .sighint{display:none}
.sigclr{position:absolute;right:8px;top:8px}
.kphoto{display:block;width:100%;max-width:260px;margin:14px auto 0;border-radius:10px}
.thumbbtn{border:0;padding:0;background:none;margin-left:6px;vertical-align:middle;cursor:zoom-in}
.thumbbtn img{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1px solid var(--line);display:block;background:var(--soft)}
.thumbbtn.gone img{display:none}
.thumbbtn.gone::after{content:'사진 지움';font-size:11px;color:var(--muted)}
#modal img.big{max-width:100%;max-height:72vh;display:block;margin:0 auto;border-radius:8px}
.mysum{margin-top:18px;padding:12px;border-radius:10px;background:var(--soft);font-size:13px;text-align:left}
.mysum b{font-family:var(--f-mono)}
.stamp{display:inline-block;margin:18px auto 6px;padding:10px 22px;border:4px double var(--stamp);color:var(--stamp);border-radius:8px;transform:rotate(-4deg);font-family:var(--f-mono);font-weight:600;font-size:20px}
.stamp b{display:block;font-size:44px;line-height:1.1}
.stamp.red{border-color:var(--red);color:var(--red)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .35s ease-out}}
@keyframes thump{0%{transform:scale(1.6) rotate(-4deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.empty{max-width:520px;margin:20px auto;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:24px}
.empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:6px}

/* board & feed */
.board{display:grid;gap:8px}
.bitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--soft);border-radius:10px}
.bitem b{font-size:15px}
.bitem .sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.feed li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--soft);font-size:14px}
.feed time{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.feed li.late{color:var(--red)} .feed li.wait{color:var(--amber)}
.alertbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--stamp-soft);margin-bottom:16px;font-size:14px}
.alertbar b{color:var(--stamp)}
.mailbar{background:var(--soft)}
.mailbar.on{background:var(--green-soft)}
.mailbar.on b{color:var(--green)}
.mailst{display:block;margin-top:4px;font-size:12px;color:var(--muted)}

/* timecard */
.tcs{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.tc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.tc header{display:flex;align-items:baseline;gap:8px;padding:14px 16px 0}
.tc header b{font-size:17px}
.tc header small{color:var(--muted)}
.tcline{margin:12px 16px;padding:12px;border:1.5px solid var(--ink);border-radius:6px;font-family:var(--f-mono);font-size:14px;line-height:1.9}
.tcline span{white-space:nowrap}
.tcline b{font-weight:600}
.tcmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;font-size:13px}
.tcmeta div{background:var(--soft);border-radius:8px;padding:6px 8px}
.tcmeta small{display:block;color:var(--muted);font-size:11px}
.tcmeta b{font-family:var(--f-mono)}
.tc details{border-top:1px solid var(--soft)}
.tc summary{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:13px}
.tc .tcfoot{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.cardtab{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12.5px}
.cardtab td,.cardtab th{padding:4px 8px;border-bottom:1px solid var(--soft);text-align:right}
.cardtab th{font-family:var(--f-body);font-weight:500;color:var(--muted)}
.cardtab td:first-child,.cardtab th:first-child{text-align:left}
.cardtab .late{color:var(--red);font-weight:600}
.cardtab .ot{color:var(--stamp);font-weight:600}
.cardtab tr.we td:first-child{color:var(--red)}

/* payroll */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .act{stroke:var(--stamp);stroke-width:2.5;fill:none}
.chart .area{fill:var(--stamp);opacity:.12}
.chart .proj{stroke:var(--muted);stroke-width:2;fill:none;stroke-dasharray:5 5}
.chart .today{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:3 3}
.chart .mk{fill:var(--card);stroke:var(--stamp);stroke-width:2.5}
.chart .mk.p{stroke:var(--muted)}
.chart .lab{fill:var(--ink);font-weight:600}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:22px}
.ledger h1{text-align:center;font-size:20px;letter-spacing:.35em;margin-bottom:2px}
.ledger .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;margin:12px 0}
.ledger table{border-collapse:collapse;font-size:12px;min-width:1100px;width:100%}
.ledger th,.ledger td{border:1px solid var(--muted);padding:5px 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger th{background:var(--soft);text-align:center;font-weight:600}
.ledger td.l{text-align:left}
.ledger tfoot td{font-weight:700;background:var(--soft)}
.ledger .note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
.ledger .sign{display:flex;justify-content:flex-end;margin-top:14px}
.ledger .sign div{border:1px solid var(--muted);width:84px;text-align:center;font-size:12px}
.ledger .sign div+div{border-left:0}
.ledger .sign b{display:block;border-bottom:1px solid var(--muted);padding:3px;background:var(--soft)}
.ledger .sign span{display:block;height:44px}

/* forms */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select,.inl input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1}
.check{display:flex!important;grid-template-columns:none;align-items:center;gap:8px;color:var(--ink)!important;font-size:14px!important}
.check input{width:18px!important;height:18px}
.schedt{width:100%;border-collapse:collapse;font-size:14px}
.schedt td{padding:4px 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg label + label span{border-left:1px solid var(--line)}
.seg input:checked + span{background:var(--stamp);color:#fff}
.seg input.off:checked + span{background:var(--muted);color:var(--card)}
.seg input:focus-visible + span{outline:2px solid var(--stamp);outline-offset:-2px}
.schedt .restlbl{display:none;padding:5px 10px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.schedt tr.rest .restlbl{display:inline-block}
.schedt tr.rest input[type=time],.schedt tr.rest input[type=number]{display:none}
.schedt tr.rest td b{color:var(--muted)}
.c-rest{color:var(--muted);background:transparent!important;font-family:var(--f-body)!important;font-size:11px}
.schedt input[type=time],.schedt input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 6px;color:var(--ink);width:100%;min-width:84px}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inl label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.slist{display:grid;gap:8px}
.sitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--soft);border-radius:10px}
.sitem b{font-size:15px}
.sitem .sub{font-size:13px;color:var(--muted)}
.sitem.off{opacity:.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}

/* toast & modal */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));z-index:50;display:grid;gap:8px;width:min(360px,calc(100vw - 24px))}
.toast{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--stamp);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer}
.toast b{display:block}
.toast span{font-size:13px;color:var(--muted)}
.toast.late{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)} .toast.ok{border-left-color:var(--green)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s ease-out}}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--card);border-radius:12px;padding:18px;width:min(520px,100%)}
#modal textarea{width:100%;min-height:140px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top"></header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

<script>
/* ===================== 기본 도구 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ymOf = ds => ds.slice(0, 7);
const parseDate = ds => { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (ds, n) => { const d = parseDate(ds); d.setDate(d.getDate()+n); return ymd(d); };
const hm2min = s => { const [h, m] = String(s||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const at = (ds, hhmm) => { const d = parseDate(ds); d.setHours(0, hm2min(hhmm), 0, 0); return d.getTime(); };
const todayStr = () => ymd(new Date());
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftYM = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const DAYS = ['일','월','화','수','목','금','토'];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const fmtT = (ms, ds) => { if (!ms) return '—'; const d = new Date(ms); const s = `${pad(d.getHours())}:${pad(d.getMinutes())}`; return ds && ymd(d) !== ds ? s + '⁺¹' : s; };
const fmtClock = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtHM = min => { min = Math.max(0, Math.round(min||0)); return `${Math.floor(min/60)}:${pad(min%60)}`; };
const fmtH = min => { min = Math.max(0, Math.round(min||0)); const h = Math.floor(min/60), m = min%60; return m ? `${h}시간 ${m}분` : `${h}시간`; };
const num = n => Math.floor(n||0).toLocaleString('ko-KR');
const won = n => num(n) + '원';
const fmtDateLong = ds => { const d = parseDate(ds); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`; };
const fmtMD = ds => { const d = parseDate(ds); return `${d.getMonth()+1}/${d.getDate()}`; };
const fmtYM = ym => { const [y, m] = ym.split('-'); return `${y}년 ${+m}월`; };
const MIN_WAGE = 10320;
const otDaysText = o => o.otDays.length ? o.otDays.map(x => `${fmtMD(x.ds)}(${fmtHM(x.min)})`).join(', ') : '없음';
const store = {
  get(k){ try { return localStorage.getItem('tc.' + k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem('tc.' + k, v); } catch {} },
  del(k){ try { localStorage.removeItem('tc.' + k); } catch {} }
};

/* ===================== 상태 ===================== */
const DEFAULT_CONFIG = { storeName:'우리 가게', ownerPin:'0000', masterPin:'', graceMin:5, otUnit:10, earlyClamp:true, otPremium:false, weeklyHoliday:true,
  rates:{ np:4.75, hi:3.595, ltc:13.14, ei:0.9 },
  mail:{ on:false, to:'', ev:{ in:true, late:true, out:false, notyet:true } },
  photo:{ on:false },
  slack:{ on:false },
  biz:{ name:'', ceo:'', addr:'', phone:'' },
  contract:{ on:false, autoOwnerSign:true, payDay:10, payMethod:'근로자 명의 예금통장에 입금', special:'' },
  tax:{ email:'', auto:false } };
const TABS = [['now','현황'],['records','출퇴근 기록'],['timecard','근무 집계'],['payroll','인건비·급여'],['contract','근로계약'],['staff','직원·설정']];
const S = {
  db:null, noDb:false, connected:false, connNote:'',
  config:{}, staff:[], ready:{config:false, staff:false, contracts:false, reports:false}, reports:{}, backupStatus:null, contracts:[], ownerSign:'', cDraft:null,
  months:{}, monthSubs:{}, monthLoaded:{},
  seen:new Map(), primed:false, notified:new Set(),
  mode:'kiosk', unlocked:false, tab:'now', editing:null,
  lockPin:'', lockErr:'', remember:false,
  kiosk:{ step:'list', staffId:null, pin:'', err:'', at:0, result:null, busy:false },
  recSub:'day', viewDate:todayStr(), month:ymOf(todayStr()), year:new Date().getFullYear(),
  sound: store.get('sound') === '1', audio:null, confirmClear:false,
  mailStatus:null, mailed:new Set(), mailBusy:false, alertStatus:null, slackBusy:false,
  photoUse:null, confirmPhotoClean:false, confirmLogout:false, pending:0
};
const cfg = () => ({ ...DEFAULT_CONFIG, ...S.config, rates:{ ...DEFAULT_CONFIG.rates, ...(S.config.rates||{}) },
  mail:{ ...DEFAULT_CONFIG.mail, ...(S.config.mail||{}), ev:{ ...DEFAULT_CONFIG.mail.ev, ...(S.config.mail?.ev||{}) } },
  photo:{ ...DEFAULT_CONFIG.photo, ...(S.config.photo||{}) }, slack:{ ...DEFAULT_CONFIG.slack, ...(S.config.slack||{}) },
  biz:{ ...DEFAULT_CONFIG.biz, ...(S.config.biz||{}) }, contract:{ ...DEFAULT_CONFIG.contract, ...(S.config.contract||{}) }, tax:{ ...DEFAULT_CONFIG.tax, ...(S.config.tax||{}) } });
const staffById = id => S.staff.find(s => s.id === id);
const activeStaff = () => S.staff.filter(s => s.active !== false);

/* ===================== 근무 계산 ===================== */
const WORKED = new Set(['done','working','extra']);
function getPunch(staffId, ds){ return S.months[ymOf(ds)]?.get(`${staffId}_${ds}`); }
function monthHasPunch(id, ym){ const m = S.months[ym]; if (!m) return false; for (const p of m.values()) if (p.staffId === id) return true; return false; }
function staffForMonth(ym){ return S.staff.filter(s => s.active !== false || monthHasPunch(s.id, ym)); }
function staffForDay(ds){ return S.staff.filter(s => s.active !== false || getPunch(s.id, ds)); }

function schedFor(st, ds, p){
  if (p && p.sched !== undefined) return p.sched;
  if (st.hireDate && ds < st.hireDate) return null;
  if (st.endDate && ds > st.endDate) return null;
  const s = st.sched?.[parseDate(ds).getDay()];
  return s && s.on ? { start:s.start, end:s.end, brk:+s.brk||0 } : null;
}
function isRegularOff(st, ds){   // 근무 기간 안인데 근무표에서 체크 안 한 요일 = 정기 휴무
  if (st.hireDate && ds < st.hireDate) return false;
  if (st.endDate && ds > st.endDate) return false;
  const s = st.sched?.[parseDate(ds).getDay()];
  return !(s && s.on);
}
function shiftMin(sc){ let a = hm2min(sc.start), b = hm2min(sc.end); if (b <= a) b += 1440; return Math.max(0, b - a - (+sc.brk||0)); }
function weeklySchedMin(st){ return (st.sched||[]).reduce((t, s) => t + (s && s.on ? shiftMin(s) : 0), 0); }

function dayCalc(st, ds, now = Date.now()){
  const C = cfg(), p = getPunch(st.id, ds), sc = schedFor(st, ds, p);
  const r = { ds, p, sc, status:'off', worked:0, paid:0, ot:0, late:0, early:0, running:false, schedMin:0, regOff: !sc && isRegularOff(st, ds) };
  const grace = (+C.graceMin||0) * 60000;
  if (sc){
    r.sStart = at(ds, sc.start); r.sEnd = at(ds, sc.end);
    if (r.sEnd <= r.sStart) r.sEnd += 86400000;
    r.schedMin = shiftMin(sc);
  }
  if (p && p.kind === 'leave'){ r.status = 'leave'; return r; }
  if (p && p.in){
    if (sc && p.in > r.sStart + grace) r.late = Math.round((p.in - r.sStart)/60000);
    let out = p.out;
    if (!out){
      if (now - p.in < 20*3600000){ out = now; r.running = true; }
      else { r.status = 'noout'; return r; }
    }
    if (sc && p.out && p.out < r.sEnd - grace) r.early = Math.round((r.sEnd - p.out)/60000);
    const effIn = (C.earlyClamp && sc && p.in < r.sStart) ? r.sStart : p.in;
    const gross = Math.max(0, (out - effIn)/60000);
    const brk = sc ? (gross >= 240 ? sc.brk : 0) : (gross >= 480 ? 60 : gross >= 240 ? 30 : 0);
    r.worked = Math.max(0, Math.floor(gross - brk));
    if (sc){
      const unit = Math.max(1, +C.otUnit||1);
      r.ot = r.running ? 0 : Math.floor(Math.max(0, r.worked - r.schedMin)/unit)*unit;
      r.paid = Math.min(r.worked, r.schedMin) + r.ot;
    } else { r.ot = r.worked; r.paid = r.worked; }
    r.status = r.running ? 'working' : (sc ? 'done' : 'extra');
    return r;
  }
  if (sc){
    const today = todayStr();
    if (ds < today) r.status = 'absent';
    else if (ds === today) r.status = now > r.sEnd ? 'absent' : now > r.sStart + grace ? 'notyet' : 'upcoming';
    else r.status = 'upcoming';
  }
  return r;
}

const isMonthly = st => st.payType === 'month';
const isEmployed = (st, ds) => (!st.hireDate || ds >= st.hireDate) && (!st.endDate || ds <= st.endDate);
function employedDays(st, ym, upto){ let n = 0; for (let d = 1; d <= daysIn(ym); d++){ const ds = `${ym}-${pad(d)}`; if ((!upto || ds <= upto) && isEmployed(st, ds)) n++; } return n; }
function dayCost(st, r, projected){
  if (isMonthly(st)) return isEmployed(st, r.ds) ? (+st.monthly || 0) / daysIn(ymOf(r.ds)) : 0;   // 월급제: 근무 기간의 날마다 월급 ÷ 그 달 일수
  const w = +st.wage||0, prem = cfg().otPremium ? 1.5 : 1;
  let min = r.paid, ot = r.ot;
  if (projected){
    if (r.status === 'upcoming' || r.status === 'notyet'){ min = r.schedMin; ot = 0; }
    else if (r.status === 'working'){ min = Math.max(r.paid, r.schedMin); }
  }
  return ((min - ot) + ot*prem) * w / 60;
}

function weekHoliday(st, sunDs, now){
  if (!cfg().weeklyHoliday || isMonthly(st)) return { eligible:false };
  let schedMin = 0, absent = false;
  for (let i = 6; i >= 0; i--){
    const r = dayCalc(st, addDays(sunDs, -i), now);
    if (r.sc) schedMin += r.schedMin;
    if (r.status === 'absent') absent = true;
  }
  if (schedMin < 900) return { eligible:false };
  const hours = Math.min(schedMin/2400, 1) * 8;
  return { eligible:true, sunDs, schedMin, absent, complete: sunDs < todayStr(), hours, amount: absent ? 0 : hours * (+st.wage||0) };
}

function deductions(st, gross){
  const R = cfg().rates, t10 = x => Math.floor(x/10)*10, map = {};
  if (st.deduct === 'biz'){ map.inc = t10(gross*0.03); map.loc = t10(map.inc*0.1); }
  else if (st.deduct === 'ins'){ map.np = t10(gross*R.np/100); map.hi = t10(gross*R.hi/100); map.ltc = t10(map.hi*R.ltc/100); map.ei = t10(gross*R.ei/100); }
  return { map, total: Object.values(map).reduce((a, b) => a + b, 0) };
}

function monthSummary(st, ym, now = Date.now()){
  const w = +st.wage||0, n = daysIn(ym);
  const o = { st, ym, workDays:0, paid:0, worked:0, ot:0, otDays:[], absentDays:[], lateDays:[], lateMin:0, earlyDays:[], leaveDays:[], restDays:[], nooutDays:[], days:[], weeks:[], holiday:0, projGross:0 };
  for (let d = 1; d <= n; d++){
    const ds = `${ym}-${pad(d)}`, r = dayCalc(st, ds, now);
    o.days.push(r);
    if (WORKED.has(r.status)){ o.workDays++; o.paid += r.paid; o.worked += r.worked; }
    if (r.ot > 0){ o.otDays.push({ ds, min:r.ot }); o.ot += r.ot; }
    if (r.status === 'absent') o.absentDays.push(ds);
    if (r.late){ o.lateDays.push({ ds, min:r.late }); o.lateMin += r.late; }
    if (r.early) o.earlyDays.push({ ds, min:r.early });
    if (r.status === 'leave') o.leaveDays.push(ds);
    if (r.status === 'off' && r.regOff && ds <= todayStr()) o.restDays.push(ds);
    if (r.status === 'noout') o.nooutDays.push(ds);
    o.projGross += dayCost(st, r, true);
    if (parseDate(ds).getDay() === 0){
      const wh = weekHoliday(st, ds, now);
      if (wh.eligible){ o.weeks.push(wh); if (wh.complete) o.holiday += wh.amount; o.projGross += wh.amount; }
    }
  }
  const prem = cfg().otPremium ? 1.5 : 1;
  o.base = Math.floor((o.paid - o.ot) * w / 60);
  o.otPay = Math.floor(o.ot * w * prem / 60);
  o.holiday = Math.floor(o.holiday);
  o.gross = o.base + o.otPay + o.holiday;
  o.projGross = Math.floor(o.projGross);
  if (isMonthly(st)){   // 월급제: 월급을 근무한 날짜 비율로 (한 달 다 일하면 월급 그대로)
    const full = Math.floor((+st.monthly || 0) * employedDays(st, ym) / n), today = todayStr();
    o.base = ym < ymOf(today) ? full : Math.floor((+st.monthly || 0) * employedDays(st, ym, today) / n);
    o.otPay = 0; o.holiday = 0; o.weeks = []; o.gross = o.base; o.projGross = full;
  }
  o.ded = deductions(st, o.gross);
  o.net = o.gross - o.ded.total;
  return o;
}

function costSeries(ym, now = Date.now()){
  const n = daysIn(ym), today = todayStr(), list = staffForMonth(ym), out = [];
  let ca = 0, cp = 0;
  for (let d = 1; d <= n; d++){
    const ds = `${ym}-${pad(d)}`, sun = parseDate(ds).getDay() === 0;
    let a = 0, p = 0;
    for (const st of list){
      const r = dayCalc(st, ds, now);
      if (ds <= today) a += dayCost(st, r, false);
      p += dayCost(st, r, true);
      if (sun){ const wh = weekHoliday(st, ds, now); if (wh.eligible){ if (wh.complete) a += wh.amount; p += wh.amount; } }
    }
    ca += a; cp += p;
    out.push({ d, ds, actual: ds <= today ? ca : null, proj: cp });
  }
  return out;
}

function openPunch(st, now = Date.now()){
  const today = todayStr();
  for (const ds of [today, addDays(today, -1)]){
    const p = getPunch(st.id, ds);
    if (p && p.in && !p.out && p.kind !== 'leave' && now - p.in < 20*3600000) return p;
  }
  return null;
}

/* ===================== 저장소 ===================== */
function punchRef(staffId, ds){ return S.db.collection(`months/${ymOf(ds)}/punches`).doc(`${staffId}_${ds}`); }
function errMsg(e){
  if (e?.code === 'quota_exceeded') return '저장 공간이 가득 찼어요. 오래된 기록을 정리해야 해요.';
  if (e?.code === 'invalid_argument') return '이 계정으로는 저장할 권한이 없어요. 사장님 계정으로 로그인해 주세요.';
  return '잠시 후 다시 시도해 주세요.';
}
async function write(fn){
  if (!S.db){ toast('저장소에 연결되지 않았어요', '인터넷 연결을 확인하고 새로고침해 주세요.', 'warn'); throw new Error('nodb'); }
  try { return await fn(); }
  catch (e){
    if (e?.code === 'unavailable'){ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { return await fn(); } catch (e2){ e = e2; } }
    toast('저장하지 못했어요', errMsg(e), 'warn'); throw e;
  }
}
function ensureMonth(ym){
  if (!S.db || S.monthSubs[ym]) return;
  S.months[ym] = S.months[ym] || new Map();
  S.monthSubs[ym] = S.db.collection(`months/${ym}/punches`).onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => m.set(d.id, { id:d.id, ...d.data() }));
    S.months[ym] = m;
    S.monthLoaded[ym] = true;
    if (!snap.metadata.fromCache) markConnected();
    if (ym === ymOf(todayStr()) || ym === shiftYM(ymOf(todayStr()), -1)) detectEvents([...m.values()]);
    scheduleRender();
  }, e => { S.monthLoaded[ym] = true; console.warn('month', ym, e); scheduleRender(); });
}
function needMonth(ym){ ensureMonth(ym); ensureMonth(shiftYM(ym, -1)); }
let connTimer = null;
function markConnected(){ if (!S.connected){ S.connected = true; S.connNote = ''; clearTimeout(connTimer); renderBanner(); } }

/* ===================== 알림 ===================== */
function beep(kind){
  if (!S.audio) return;
  try {
    const ctx = S.audio, t = ctx.currentTime;
    const tones = kind === 'late' ? [660, 440, 660] : kind === 'ok' ? [880] : [740, 990];
    tones.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';

function schedSummary(sched){
  const groups = new Map();
  for (const i of WEEK_ORDER){ const s = sched?.[i]; if (s && s.on){ const k = `${s.start}–${s.end}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(DAYS[i]); } }
  if (!groups.size) return '정해진 근무 없음';
  const rest = WEEK_ORDER.filter(i => !(sched?.[i]?.on)).map(i => DAYS[i]);
  return [...groups].map(([k, d]) => `${d.join('·')} ${k}`).join(' / ') + (rest.length ? ` · ${rest.join('·')} 정기 휴무` : '');
}

function kioskStatus(st, now){
  const today = todayStr(), op = openPunch(st, now), tp = getPunch(st.id, today), sc = schedFor(st, today, tp);
  if (op) return { cls: op.lateMin ? 'late' : 'working', text:`출근 ${fmtT(op.in)} · 근무 중` };
  if (tp && tp.out) return { cls:'done', text:`퇴근 ${fmtT(tp.out)}` };
  if (tp && tp.kind === 'leave') return { cls:'', text:'오늘 휴무' };
  if (sc) return { cls: now > at(today, sc.start) + cfg().graceMin*60000 ? 'wait' : '', text:`오늘 ${sc.start}–${sc.end}` };
  return { cls:'', text: isRegularOff(st, today) ? '오늘 정기 휴무' : '오늘 근무 없음' };
}

function pinPad(title, sub, val, ctx, err){
  const keys = ['1','2','3','4','5','6','7','8','9','back','0','cancel'];
  return `<h2>${title}</h2><p>${sub}</p>
    <div class="pindots">${[0,1,2,3].map(i => `<i class="${i < val.length ? 'on' : ''}"></i>`).join('')}</div>
    ${err ? `<p class="err">${esc(err)}</p>` : ''}
    <div class="pad">${keys.map(x => `<button data-act="pad" data-ctx="${ctx}" data-v="${x}" class="${x.length > 1 ? 'fn' : ''}">${x === 'back' ? '지우기' : x === 'cancel' ? '취소' : x}</button>`).join('')}</div>`;

function buildFeed(today, now){
  const items = [];
  for (const st of staffForDay(today)){
    const p = getPunch(st.id, today), r = dayCalc(st, today, now);
    if (p && p.in) items.push({ t:p.in, cls: r.late ? 'late' : '', text:`<b>${esc(st.name)}</b> 출근${r.late ? ` — ${r.late}분 지각 (예정 ${r.sc.start})` : ''}` });
    if (p && p.out) items.push({ t:p.out, cls:'', text:`<b>${esc(st.name)}</b> 퇴근 — ${fmtH(r.worked)} 근무${r.early ? ` · ${r.early}분 일찍` : ''}` });
    if (r.status === 'notyet') items.push({ t:r.sStart + cfg().graceMin*60000, cls:'wait', text:`<b>${esc(st.name)}</b> 아직 출근 기록 없음 (예정 ${r.sc.start}) — 지각 의심` });
    if (r.status === 'absent') items.push({ t:r.sEnd, cls:'late', text:`<b>${esc(st.name)}</b> 오늘 근무 시간이 끝났는데 출근 기록이 없어요 (결근)` });
    const y = addDays(today, -1), ry = dayCalc(st, y, now);
    if (ry.status === 'noout') items.push({ t:ry.p.in, cls:'wait', text:`<b>${esc(st.name)}</b> 어제 퇴근 기록이 없어요 → ‘출퇴근 기록’에서 고쳐 주세요` });
    const yp = getPunch(st.id, y);
    if (yp && yp.out && ymd(new Date(yp.out)) === today) items.push({ t:yp.out, cls:'', text:`<b>${esc(st.name)}</b> 퇴근 (어제 시작한 근무)` });
  }
  return items.sort((a, b) => b.t - a.t);
}

      return `<tr class="edit"><td><b>${esc(st.name)}</b></td><td colspan="6">

function niceMax(v){ if (v <= 0) return 100000; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
const fmtMan = v => v >= 10000 ? `${(Math.round(v/1000)/10).toLocaleString('ko-KR')}만` : `${Math.round(v)}`;
function chartSVG(series){

  const max = niceMax(Math.max(...series.map(s => s.proj || 0), ...series.map(s => s.actual || 0)));
  const x = d => L + (d - 1) * (W - L - R) / Math.max(1, n - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtMan(v)}</text>`; }
  [1, 5, 10, 15, 20, 25, n].filter((d, i, a) => d <= n && a.indexOf(d) === i && !(d !== n && n - d < 3)).forEach(d => { g += `<text x="${x(d)}" y="${H - 10}" text-anchor="middle">${d}일</text>`; });
  const act = series.filter(s => s.actual != null);
  if (act.length){
    const pts = act.map(s => `${x(s.d)},${y(s.actual)}`).join(' ');
    g += `<polygon class="area" points="${x(1)},${y(0)} ${pts} ${x(act[act.length-1].d)},${y(0)}"/><polyline class="act" points="${pts}"/>`;
  }
  const lastA = act[act.length - 1];
  const projPts = series.filter(s => !lastA || s.d >= lastA.d).map(s => `${x(s.d)},${y(s.d === lastA?.d ? lastA.actual : s.proj)}`).join(' ');
  if (!lastA || lastA.d < n) g += `<polyline class="proj" points="${projPts}"/>`;
  if (lastA && lastA.d < n) g += `<line class="today" x1="${x(lastA.d)}" x2="${x(lastA.d)}" y1="${T - 10}" y2="${H - B}"/><text x="${x(lastA.d)}" y="${T - 14}" text-anchor="middle" style="fill:var(--amber)">오늘</text>`;
  [10, 20, n].forEach(d => {
    const s = series[d - 1]; if (!s) return;
    const isA = s.actual != null, v = isA ? s.actual : s.proj;
    g += `<circle class="mk ${isA ? '' : 'p'}" cx="${x(d)}" cy="${y(v)}" r="5"/><text class="lab" x="${x(d) + (d === n ? -8 : 0)}" y="${y(v) - 10}" text-anchor="${d === n ? 'end' : 'middle'}">${fmtMan(v)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일자별 누적 인건비">${g}</svg>`;
}

   서명한 계약서는 그대로 두고, 내용을 바꾸면 새 버전(변경 계약서)을 만들어 다시 서명받아요. */
const INS = [['emp','고용보험'],['acc','산재보험'],['np','국민연금'],['hi','건강보험']];

const C_LABEL = { none:['계약서 없음','faint'], draft:['직원 서명 대기','amber'], owner:['사장님 서명 대기','amber'], signed:['서명 완료','ok'] };
const SIG_RE = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
const fmtKDate = ds => { if (!ds) return '    년   월   일'; const d = parseDate(ds); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
function contractsOf(sid){ return S.contracts.filter(c => c.staffId === sid).sort((a, b) => (b.ver || 0) - (a.ver || 0)); }
function currentContract(sid){ return contractsOf(sid)[0] || null; }
function signedContract(sid){ return contractsOf(sid).find(c => c.empSign && c.ownerSign) || null; }
function cStatus(c){ return !c ? 'none' : c.empSign && c.ownerSign ? 'signed' : c.empSign ? 'owner' : 'draft'; }

function defaultTerms(st){
  const cc = cfg().contract, sched = (st.sched || defaultSched()).map(s => ({ on: !!s?.on, start: s?.start || '09:00', end: s?.end || '18:00', brk: +s?.brk || 0 }));
  const off = WEEK_ORDER.find(i => !sched[i].on);
  return { startDate: st.hireDate || firstPunchDate(st.id) || todayStr(), endDate:'', place: cfg().biz.addr || cfg().storeName, job: st.position || '매장 업무',
    sched, holiday: off ?? 0, wage: +st.wage || MIN_WAGE, payType: isMonthly(st) ? 'month' : 'hour', monthly: +st.monthly || 0, bonus:'없음', extraPay:'없음', payDay: cc.payDay, payMethod: cc.payMethod,
    ins:{ emp:true, acc:true, np: st.deduct === 'ins', hi: st.deduct === 'ins' }, special: cc.special || '' };
}
async function createContract(st, terms, prev){
  const ver = (contractsOf(st.id)[0]?.ver || 0) + 1, id = `${st.id}_v${ver}`;
  const doc = { staffId:st.id, name:st.name, ver, createdAt:Date.now(), terms: terms || defaultTerms(st), emp: prev?.emp || {}, empSign:'', empSignedAt:0, ownerSign:'', ownerSignedAt:0, prev: prev?.id || '' };
  await write(() => S.db.doc('contracts/' + id).set(doc));
  if (!S.contracts.some(c => c.id === id)) S.contracts.push({ id, ...doc });   // 저장소 소식이 오기 전에도 바로 쓰도록
  return S.contracts.find(c => c.id === id);
}
async function contractNeeded(st){   // 첫 출근(계약서 없음)이면 표준근로계약서를 자동으로 만들고, 서명 안 한 계약서를 돌려줌
  if (!cfg().contract.on || !S.ready.contracts) return null;
  let c = currentContract(st.id);
  if (!c){ try { c = await createContract(st); } catch { return null; } }

async function contractHash(c){
  try {
    const data = JSON.stringify([c.staffId, c.ver, c.terms, c.biz, c.emp, c.empSign, c.empSignedAt, c.ownerSign, c.ownerSignedAt]);
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
  } catch { return ''; }
}

/* ---------- 서명판 ---------- */
const SIG = {};
function sigPad(id, hint = '여기에 손가락으로 서명해 주세요'){
  return `<div class="sigwrap"><canvas id="${id}" class="sigpad" aria-label="${hint}"></canvas><span class="sighint">${hint}</span>
    <button type="button" class="btn sm sigclr" data-act="sigClear" data-id="${id}">다시 쓰기</button></div>`;
}
function initSigs(){ document.querySelectorAll?.('canvas.sigpad').forEach(c => initSig(c)); }
function initSig(c){
  if (c.dataset.ready) return;
  c.dataset.ready = '1';
  const id = c.id, r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  const g = c.getContext('2d');
  g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111';
  SIG[id] = { n:0 };
  let down = false, lx = 0, ly = 0;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener('pointerdown', e => { down = true; try { c.setPointerCapture(e.pointerId); } catch {} [lx, ly] = pos(e); g.beginPath(); g.arc(lx, ly, 1.3, 0, 7); g.fill(); SIG[id].n++; c.parentNode.classList.add('signed'); S.kiosk.at = Date.now(); e.preventDefault(); });
  c.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.stroke(); lx = x; ly = y; SIG[id].n++; e.preventDefault(); });
  const up = () => { down = false; };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up); c.addEventListener('pointerleave', up);
}
function clearSig(id){ const c = $('#' + id); if (!c) return; c.getContext('2d').clearRect(0, 0, c.width, c.height); if (SIG[id]) SIG[id].n = 0; c.parentNode.classList.remove('signed'); }
function sigData(id){
  const c = $('#' + id);
  if (!c || !SIG[id] || SIG[id].n < 3) return '';
  const w = Math.min(600, c.width), h = Math.round(c.height * w / c.width), o = document.createElement('canvas');
  o.width = w; o.height = h; o.getContext('2d').drawImage(c, 0, 0, w, h);
  return o.toDataURL('image/png');
}

      <label class="check full"><input type="checkbox" id="k-agree"> 위 근로계약서 내용을 모두 읽었고 이에 동의합니다</label>

async function kioskSign(){
  const k = S.kiosk, c = S.contracts.find(x => x.id === k.contractId);
  if (!c || k.busy) return;
  const addr = $('#k-addr').value.trim(), phone = $('#k-phone').value.trim(), email = mailAddrs($('#k-email').value)[0] || '';
  if (!addr || !phone){ toast('주소와 연락처를 넣어 주세요', '계약서에 들어가는 내용이에요.', 'warn'); return; }
  if (!$('#k-agree').checked){ toast('동의 칸에 체크해 주세요', '', 'warn'); return; }
  const sig = sigData('sig-emp');
  if (!sig){ toast('서명을 해 주세요', '네모 칸에 손가락으로 이름을 써 주세요.', 'warn'); return; }
  k.busy = true; const btn = document.querySelector?.('[data-act="kSign"]'); if (btn){ btn.disabled = true; btn.textContent = '저장하는 중…'; }
  const upd = { emp:{ addr, phone, email }, empSign:sig, empSignedAt:Date.now() };
  if (cfg().contract.autoOwnerSign && S.ownerSign) Object.assign(upd, ownerSignFields());
  try {
    if (upd.ownerSign) upd.hash = await contractHash({ ...c, ...upd });
    await write(() => S.db.doc('contracts/' + c.id).update(upd));
    Object.assign(c, upd);
    k.result = { kind:'contract', t:upd.empSignedAt, late:false, msg: upd.ownerSign ? '근로계약서 서명이 끝났어요. 사본은 사장님께 받으세요.' : '서명했어요. 사장님 서명까지 되면 계약이 완료돼요.' };
    k.step = 'done'; k.at = Date.now(); beep('ok');
  } catch {}
  k.busy = false; render(true);
}

const CACT = {
  sigClear(d){ clearSig(d.id); },
  async kSign(){ await kioskSign(); },
  kSignLater(){ const k = S.kiosk; if (k.result && k.result.kind !== 'contract'){ k.step = 'done'; k.at = Date.now(); render(true); } else { resetKiosk(); render(true); } },
  async cToggle(){
    const cc = cfg().contract;
    await write(() => S.db.doc('config/main').set({ ...S.config, contract:{ ...cc, on:!cc.on } }));
    toast(cc.on ? '계약서 받기를 껐어요' : '계약서 받기를 켰어요', cc.on ? '' : '계약서가 없는 직원이 다음에 출근하면 서명 화면이 나와요.', 'ok'); render(true);
  },
  cBiz(){ S.editing = 'cbiz'; render(true); },
  async cBizSave(){
    const biz = { name: $('#cb-name').value.trim(), ceo: $('#cb-ceo').value.trim(), addr: $('#cb-addr').value.trim(), phone: $('#cb-phone').value.trim() };
    const contract = { ...cfg().contract, payDay: Math.min(31, Math.max(1, Math.round(+$('#cb-payday').value || 10))), payMethod: $('#cb-paym').value, special: $('#cb-special').value.trim(), autoOwnerSign: $('#cb-auto').checked };
    await write(() => S.db.doc('config/main').set({ ...S.config, biz, contract }));
    toast('계약서 기본 설정을 저장했어요', '', 'ok'); S.editing = null; render(true);
  },
  cSignReg(){ S.tab = 'contract'; S.editing = 'csign'; render(true); },
  async cSignSave(){
    const data = sigData('sig-owner');
    if (!data){ toast('서명을 해 주세요', '', 'warn'); return; }
    await write(() => S.db.doc('config/sign').set({ data, at:Date.now() }));
    S.ownerSign = data; toast('사장님 서명을 등록했어요', '', 'ok'); S.editing = null; render(true);
  },
  async cNew(d){ const st = staffById(d.id); if (!st) return; const c = await createContract(st); S.editing = 'cview:' + c.id; render(true); },
  cView(d){ S.cDraft = null; S.editing = 'cview:' + d.id; render(true); scrollTo(0, 0); },
  cEdit(d){ S.cDraft = null; S.editing = 'cedit:' + d.id; render(true); scrollTo(0, 0); },
  cReload(d){ const c = S.contracts.find(x => x.id === d.id), st = c && staffById(c.staffId); if (!st) return; const f = readContractForm(c.terms), dt = defaultTerms(st); S.cDraft = { ...f, sched: dt.sched, wage: dt.wage, payType: dt.payType, monthly: dt.monthly }; render(true); toast('근무 시간과 시급을 불러왔어요', '저장을 눌러야 계약서에 들어가요.', 'ok'); },
  async cSave(d){
    const c = S.contracts.find(x => x.id === d.id), st = c && staffById(c.staffId);
    if (!c || !st) return;
    const terms = readContractForm(S.cDraft || c.terms);
    if (!terms.place || !terms.job){ toast('근무 장소와 업무 내용을 넣어 주세요', '', 'warn'); return; }
    if (terms.payType !== 'month' && terms.wage < MIN_WAGE) toast('시급이 2026년 최저시급(10,320원)보다 낮아요', '저장은 했어요. 금액을 다시 확인해 주세요.', 'warn');
    if (c.empSign){ const n = await createContract(st, terms, c); toast('변경 계약서를 만들었어요', '직원이 다음 출근 때나 ‘이 기기에서 서명받기’로 다시 서명해요.', 'ok'); S.editing = 'cview:' + n.id; }
    else { await write(() => S.db.doc('contracts/' + c.id).update({ terms })); c.terms = terms; toast('계약서 내용을 고쳤어요', '', 'ok'); S.editing = 'cview:' + c.id; }
    S.cDraft = null; render(true);
  },
  async cOwnerSign(d){
    const c = S.contracts.find(x => x.id === d.id);

  },
  async cFile(d){ const c = S.contracts.find(x => x.id === d.id); if (c) await saveFile(`근로계약서_${c.name}_${c.ver}.html`, contractFile(c)); },
  async cMail(d){

        body:`${c.name}님, 근로계약서 사본을 보내 드려요.\n첨부 파일을 열면 계약서를 보고 인쇄할 수 있어요.\n\n${cfg().biz.name || cfg().storeName} 드림`,
        attachments:[{ content: await blobB64(new Blob([html], { type:'text/html' })), filename:`근로계약서_${c.name}.html`, mimeType:'text/html' }] }, { cache:false });
      toast('계약서 사본을 보냈어요', to, 'ok');
    } catch (e){ toast('메일을 보내지 못했어요', mailErrText(e), 'warn'); }
  }
};

/* ===================== 세무사 전달용 급여 내역 =====================
   월말에 세무사 사무실에 보내던 문자를 자동으로 정리해요. 4대보험 가입자 / 미가입(인건비 신고자)로 나누고,
   세전 급여·입사일(·퇴사일·주민번호)만 담아요. 금액은 보내기 전에 고칠 수 있어요. */
const RRN_RE = /^(\d{6})-?(\d{7})$/;
const maskRrn = r => { const m = RRN_RE.exec(r || ''); return m ? `${m[1]}-${m[2][0]}******` : ''; };
const fmtYYMD = ds => { if (!ds) return ''; const d = parseDate(ds); return `${String(d.getFullYear()).slice(2)}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const prevYM = () => shiftYM(ymOf(todayStr()), -1);
function reportRows(ym){
  const now = Date.now(), ongoing = ym >= ymOf(todayStr()), rep = S.reports[ym] || {}, first = `${ym}-01`, last = `${ym}-${pad(daysIn(ym))}`;
  return staffForMonth(ym).filter(st => !st.sample && (!st.hireDate || st.hireDate <= last) && (!st.endDate || st.endDate >= first)).map(st => {
    const o = monthSummary(st, ym, now), calc = ongoing ? o.projGross : o.gross;
    const amount = rep.amounts?.[st.id] ?? calc;
    const newHire = !!st.hireDate && st.hireDate >= first && st.hireDate <= last;
    const withRrn = !!st.rrn && (rep.rrn?.[st.id] ?? newHire);
    return { st, o, calc, amount: Math.round(+amount || 0), edited: rep.amounts?.[st.id] != null && +rep.amounts[st.id] !== calc, ins: st.deduct === 'ins', newHire, withRrn,
      left: st.endDate && st.endDate >= first && st.endDate <= last ? st.endDate : '' };
  }).filter(r => r.amount > 0 || r.o.workDays);
}
function reportText(ym, rows = reportRows(ym), mask = false){
  const [y, m] = ym.split('-'), rep = S.reports[ym] || {};
  const block = list => list.length ? list.map((r, i) => `${i + 1}. ${r.st.name}: 입사일 ${fmtYYMD(r.st.hireDate) || '(입사일 없음)'}${r.left ? ` / 퇴사일 ${fmtYYMD(r.left)}` : ''}${r.withRrn ? `\n${mask ? maskRrn(r.st.rrn) : r.st.rrn}` : ''}\n(급여: [세전] ${num(r.amount)}원)`).join('\n\n') : '(없음)';
  return `안녕하세요. ${y.slice(2)}년 ${+m}월 급여내역 보내드립니다.

<4대보험 가입자 급여신고자>

${block(rows.filter(r => r.ins))}

<4대보험 미가입 인건비 신고자>

${block(rows.filter(r => !r.ins))}${rep.note ? `\n\n참고: ${rep.note}` : ''}

- ${cfg().biz.name || cfg().storeName} 드림`;
}
function reportCSV(ym, rows = reportRows(ym)){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const head = ['번호','구분','성명','입사일','퇴사일','주민등록번호','세전 급여(원)','급여 방식','근무일수','인정 근무시간'];
  const lines = rows.sort((a, b) => b.ins - a.ins).map((r, i) => [i + 1, r.ins ? '4대보험 가입' : '4대보험 미가입', r.st.name, r.st.hireDate || '', r.left, r.withRrn ? r.st.rrn : '', r.amount,
    isMonthly(r.st) ? `월급 ${r.st.monthly}` : `시급 ${r.st.wage}`, r.o.workDays, (r.o.paid / 60).toFixed(2)].map(q).join(','));
  return '﻿' + [head.join(','), ...lines].join('\r\n');
}
function taxPanel(ym){
  const rows = reportRows(ym), t = cfg().tax, rep = S.reports[ym] || {}, ongoing = ym >= ymOf(todayStr()), [y, m] = ym.split('-');
  const editing = S.editing === 'report:' + ym;
  const sent = rep.sentAt ? `<span class="chip ok">${fmtMD(ymd(new Date(rep.sentAt)))} ${fmtT(rep.sentAt)} ${rep.auto ? '자동으로 ' : ''}보냄</span>` : rep.err ? `<span class="chip red" title="${esc(rep.err)}">자동 보내기 실패</span>` : '<span class="chip faint">아직 안 보냄</span>';
  const total = rows.reduce((s, r) => s + r.amount, 0);
  if (editing) return `<section class="panel" id="taxSec"><h3>세무사 전달용 급여 내역 고치기 <small>${y}년 ${+m}월</small></h3>
    <div class="tscroll"><table class="t"><thead><tr><th>직원</th><th>구분</th><th class="r">계산된 금액</th><th class="r">보낼 세전 급여</th><th>주민번호 같이 보내기</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.st.name)}</b>${r.newHire ? ' <span class="chip blue">이달 입사</span>' : ''}</td><td>${r.ins ? '4대보험 가입' : '미가입'}</td><td class="r mono">${num(r.calc)}</td>
      <td class="r"><input type="number" class="inlnum" id="rp-amt-${r.st.id}" value="${r.amount}" min="0" step="10"></td>
      <td>${r.st.rrn ? `<label class="check"><input type="checkbox" id="rp-rrn-${r.st.id}" ${r.withRrn ? 'checked' : ''}> ${maskRrn(r.st.rrn)}</label>` : '<span class="small muted">등록 안 됨</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="form" style="margin-top:10px"><label class="full">세무사님께 덧붙일 말 (선택)<input id="rp-note" value="${esc(rep.note || '')}" placeholder="예: 이기종님 10월 상여 30만 원 포함"></label></div>
    <p class="hint">구분(4대보험 가입/미가입)은 직원 정보의 ‘급여에서 떼는 것’이 4대보험이면 가입자로 나눠요. 주민번호는 ‘직원·설정’에서 넣을 수 있어요.</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="rpSave" data-ym="${ym}">저장</button><button class="btn" data-act="rpReset" data-ym="${ym}">계산된 금액으로 되돌리기</button><button class="btn" data-act="cancelEdit">취소</button></div></section>`;
  return `<section class="panel" id="taxSec"><h3>세무사 전달용 급여 내역 <small>${y}년 ${+m}월 · ${rows.length}명 · 세전 합계 ${num(total)}원</small><span class="spacer"></span>${sent}</h3>
    ${ongoing ? '<p class="hint" style="margin-top:0">이번 달은 아직 끝나지 않았어요. 지금은 근무표대로 일했을 때의 <b>말일 예상 금액</b>으로 채워져 있어요.</p>' : ''}
    <pre class="taxtext">${esc(reportText(ym, rows, true))}</pre>
    <div class="row" style="margin-top:10px">
      <button class="btn pri" data-act="rpMail" data-ym="${ym}">${t.email ? '세무사에게 메일 보내기' : '메일 주소 넣고 보내기'}</button>
      <button class="btn" data-act="rpCopy" data-ym="${ym}">문자용 복사</button>
      <button class="btn" data-act="rpCsv" data-ym="${ym}">엑셀 파일(CSV) 받기</button>
      <button class="btn" data-act="rpEdit" data-ym="${ym}">금액·내용 고치기</button>
    </div>
    <div class="taxset">
      <label>세무사 사무실 메일<input id="tx-email" value="${esc(t.email)}" inputmode="email" placeholder="예: 세무사 사무실 메일 주소"></label>
      <label class="check"><input type="checkbox" id="tx-auto" ${t.auto ? 'checked' : ''}> 매월 1일 오전 9시가 지나면 지난달 내역을 자동으로 보내기</label>
      <button class="btn sm" data-act="rpSet">보내기 설정 저장</button>
    </div>
    <p class="hint">‘문자용 복사’를 누르면 지금처럼 카톡·문자에 붙여 넣을 수 있어요. 메일로 보내면 같은 내용에 엑셀 파일이 첨부돼요. 자동 보내기는 가게 태블릿(출퇴근 화면)이 켜져 있을 때 보내지고, 금액을 고쳐 둔 게 있으면 고친 금액으로 보내요.</p>
  </section>`;
}
async function sendReport(ym, auto){
  const t = cfg().tax, to = mailAddrs(t.email);
  if (!to.length) return { ok:false, err:'세무사 메일 주소가 없어요' };
  const rows = reportRows(ym), [y, m] = ym.split('-');
  const mcp = await getMcp();
  if (!mcp) return { ok:false, err: mailErrText({ code:'not_granted' }) };
  try {
    await mcp.callTool('Gmail', 'send_message', { to, subject:`[${cfg().biz.name || cfg().storeName}] ${y.slice(2)}년 ${+m}월 급여내역`, body: reportText(ym, rows),
      attachments:[{ content: await blobB64(new Blob([reportCSV(ym, rows)], { type:'text/csv' })), filename:`급여내역_${ym}.csv`, mimeType:'text/csv' }] }, { cache:false });
    await S.db.doc('reports/' + ym).set({ ...(S.reports[ym] || {}), sentAt:Date.now(), sentTo:to.join(', '), auto:!!auto, err:'' });
    return { ok:true };
  } catch (e){
    const err = mailErrText(e);
    if (auto) S.db.doc('reports/' + ym).set({ ...(S.reports[ym] || {}), err, triedOn:todayStr() }).catch(() => {});
    return { ok:false, err };
  }
}
let reportBusy = false;
async function autoReport(){   // 출퇴근 화면(태블릿)에서만: 매월 1일 9시 이후 지난달 내역을 한 번 보냄
  const t = cfg().tax, now = new Date();
  if (reportBusy || S.mode !== 'kiosk' || !t.auto || !mailAddrs(t.email).length || !S.db || !S.ready.staff || !S.ready.reports || now.getHours() < 9) return;
  const ym = prevYM(), rep = S.reports[ym] || {};
  needMonth(ym);
  if (rep.sentAt || rep.triedOn === todayStr() || !S.monthLoaded[ym]) return;
  reportBusy = true;
  try {
    const ref = S.db.doc('reports/' + ym), cur = await ref.get();   // 태블릿이 여러 대여도 한 번만
    const d = cur.exists ? cur.data() : {};
    if (d.sentAt || d.triedOn === todayStr()) return;
    await ref.set({ ...d, triedOn:todayStr() });
    S.reports[ym] = { ...d, triedOn:todayStr() };
    await sendReport(ym, true);
  } catch (e){ console.warn('report', e); }
  finally { reportBusy = false; }
}
function reportReminder(){
  const ym = prevYM(), rep = S.reports[ym];
  if (!S.ready.reports || new Date().getDate() > 10 || rep?.sentAt || !staffForMonth(ym).some(st => !st.sample)) return '';
  const [y, m] = ym.split('-');
  return `<div class="alertbar" style="background:var(--amber-soft)"><span>📮 <b style="color:var(--amber)">${+m}월 급여 내역</b>을 아직 세무사에게 보내지 않았어요.</span><span class="spacer"></span><button class="btn sm" data-act="rpGo">보내러 가기</button></div>`;
}
const RACT = {
  rpGo(){ S.tab = 'payroll'; S.month = prevYM(); S.editing = null; store.set('tab', 'payroll'); render(true); $('#taxSec')?.scrollIntoView({ block:'start' }); },
  rpEdit(d){ S.editing = 'report:' + d.ym; render(true); $('#taxSec')?.scrollIntoView({ block:'start' }); },
  async rpSave(d){
    const rows = reportRows(d.ym), amounts = {}, rrn = {};
    for (const r of rows){
      const v = Math.round(+$('#rp-amt-' + r.st.id).value || 0);
      if (v !== r.calc) amounts[r.st.id] = v;
      const cb = $('#rp-rrn-' + r.st.id); if (cb && r.st.rrn) rrn[r.st.id] = cb.checked;
    }
    await write(() => S.db.doc('reports/' + d.ym).set({ ...(S.reports[d.ym] || {}), amounts, rrn, note: $('#rp-note').value.trim() }));
    toast('급여 내역을 저장했어요', '', 'ok'); S.editing = null; render(true);
  },
  async rpReset(d){ await write(() => S.db.doc('reports/' + d.ym).set({ ...(S.reports[d.ym] || {}), amounts:{} })); toast('계산된 금액으로 되돌렸어요', '', 'ok'); render(true); },
  rpCopy(d){ copyText(reportText(d.ym), '급여 내역을 복사했어요', '세무사님 카톡이나 문자에 붙여 넣으세요.'); },
  async rpCsv(d){ await saveFile(`급여내역_${d.ym}.csv`, reportCSV(d.ym)); },
  async rpSet(){
    const email = mailAddrs($('#tx-email').value)[0] || '', auto = $('#tx-auto').checked;
    if (auto && !email){ toast('세무사 메일 주소를 넣어 주세요', '자동으로 보내려면 주소가 필요해요.', 'warn'); return; }
    await write(() => S.db.doc('config/main').set({ ...S.config, tax:{ ...cfg().tax, email, auto } }));
    toast('보내기 설정을 저장했어요', auto ? '매월 1일 오전 9시 이후 가게 태블릿이 지난달 내역을 보내요.' : '', 'ok'); render(true);
  },
  async rpMail(d){
    const typed = mailAddrs($('#tx-email')?.value)[0];
    if (typed && typed !== cfg().tax.email){ const nc = { ...S.config, tax:{ ...cfg().tax, email:typed } }; await write(() => S.db.doc('config/main').set(nc)); S.config = nc; }
    if (!typed && !cfg().tax.email){ toast('세무사 메일 주소를 넣어 주세요', '아래 칸에 넣은 뒤 다시 눌러 주세요.', 'warn'); $('#tx-email')?.focus(); return; }
    const r = await sendReport(d.ym, false);
    toast(r.ok ? '세무사에게 급여 내역을 보냈어요' : '메일을 보내지 못했어요', r.ok ? cfg().tax.email : r.err, r.ok ? 'ok' : 'warn');
    render(true);
  }
};

/* ===================== 전체 백업 =====================
   저장소의 모든 기록을 파일 하나(.json)로 받아요. 출퇴근 기록은 엑셀(.csv)로도 받을 수 있어요.
   사진은 파일이 커서 넣지 않고, 사진 번호(id)만 기록에 남아요. */
let backupBusy = false;
function backupMonths(){   // 가장 이른 입사일·기록 달부터 이번 달까지 (최대 10년)
  const cur = ymOf(todayStr());
  let from = cur;
  for (const st of S.staff) if (st.hireDate && ymOf(st.hireDate) < from) from = ymOf(st.hireDate);
  for (const ym of Object.keys(S.months)) if (S.months[ym].size && ym < from) from = ym;
  const out = [];
  for (let ym = from; ym <= cur && out.length < 120; ym = shiftYM(ym, 1)) out.push(ym);
  return out;
}
async function readAllPunches(onStep){
  const out = {};
  const months = backupMonths();
  for (let i = 0; i < months.length; i++){
    const ym = months[i];
    onStep?.(i + 1, months.length);
    const snap = await S.db.collection(`months/${ym}/punches`).limit(1000).get();
    if (snap.docs.length) out[ym] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  }
  return out;
}
const backupStamp = () => { const d = new Date(); return `${ymd(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`; };
function backupLine(){
  const b = S.backupStatus;
  if (!b?.at) return '<span style="color:var(--amber)">아직 백업한 적이 없어요.</span>';
  const days = Math.floor((Date.now() - b.at) / 86400000);
  const when = `${fmtMD(ymd(new Date(b.at)))} ${fmtT(b.at)}`;
  return days > 30 ? `<span style="color:var(--amber)">마지막 백업 ${when} (${days}일 전) — 새로 받아 두세요.</span>` : `마지막 백업 ${when}${b.kind === 'csv' ? ' (출퇴근 엑셀)' : ''}`;
}
function backupPanel(){
  return `<section class="panel" style="margin-top:16px" id="backupSec"><h3>데이터 백업 <small>저장소의 기록을 내 기기에 파일로 받아 두기</small></h3>
    <p class="small" style="margin:0 0 10px">${backupLine()}</p>
    <div class="row">
      <button class="btn pri" data-act="bkAll" ${backupBusy ? 'disabled' : ''}>전체 백업 파일 받기 (.json)</button>
      <button class="btn" data-act="bkCsv" ${backupBusy ? 'disabled' : ''}>출퇴근 기록 전체 엑셀 받기 (.csv)</button>
      <span class="small muted" id="bkNote"></span>
    </div>
    <p class="hint">전체 백업에는 가게 설정, 직원 정보, 모든 달의 출퇴근 기록, 근로계약서와 서명, 세무사 전달 내역이 들어가요. 사진은 크기 때문에 빠지고 사진 번호만 남아요.<br>
    <b>백업 파일에는 주민번호·연락처·서명이 들어 있어요.</b> 카톡 등으로 함부로 보내지 말고, 사장님만 쓰는 PC나 USB, 클라우드에 보관하세요. 한 달에 한 번 받아 두시길 권해요.</p>
  </section>`;
}
async function backupMark(kind){ try { await S.db.doc('status/backup').set({ at:Date.now(), kind }); } catch {} }
const BACT = {
  async bkAll(){
    if (backupBusy || !S.db) return;
    backupBusy = true;
    const note = $('#bkNote'), step = (i, n) => { if (note) note.textContent = `기록 모으는 중… (${i}/${n}달)`; };
    try {
      const punches = await readAllPunches(step);
      const data = {
        app:'가게 타임카드 백업', format:1, exportedAt:new Date().toISOString(), store: cfg().storeName,
        config: S.config, ownerSign: S.ownerSign || '', staff: S.staff, punches, contracts: S.contracts, reports: S.reports,
        counts:{ staff: S.staff.length, punches: Object.values(punches).reduce((t, a) => t + a.length, 0), months: Object.keys(punches).length, contracts: S.contracts.length },
        note:'사진 파일은 포함되지 않았어요 (기록의 inPhoto/outPhoto는 사진 번호).'
      };
      if (note) note.textContent = '파일 만드는 중…';
      const dl = window.tcStore?.use ? await window.tcStore.use('downloads') : null;
      if (!dl){ toast('이 화면에서는 파일 저장을 쓸 수 없어요', '새로고침한 뒤 다시 눌러 주세요.', 'warn'); return; }
      try {
        await dl.save({ filename:`타임카드_백업_${backupStamp()}.json`, data: JSON.stringify(data, null, 1) });
        await backupMark('json');
        toast('전체 백업 파일을 저장했어요', `직원 ${data.counts.staff}명 · 출퇴근 ${data.counts.punches}건 · 계약서 ${data.counts.contracts}건`, 'ok');
      } catch (e){ if (e?.code !== 'declined') toast('저장하지 못했어요', e?.message || '', 'warn'); }
    } catch (e){ toast('기록을 모으지 못했어요', '인터넷 연결을 확인하고 다시 눌러 주세요.', 'warn'); console.warn(e); }
    finally { backupBusy = false; if (note) note.textContent = ''; render(true); }
  },
  async bkCsv(){
    if (backupBusy || !S.db) return;
    backupBusy = true;
    const note = $('#bkNote');
    try {
      const punches = await readAllPunches((i, n) => { if (note) note.textContent = `기록 모으는 중… (${i}/${n}달)`; });
      const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
      const name = id => staffById(id)?.name;
      const rows = Object.values(punches).flat().sort((a, b) => (a.date + (name(a.staffId) || a.name)).localeCompare(b.date + (name(b.staffId) || b.name), 'ko'));
      const lines = rows.map(p => [p.date, DAYS[parseDate(p.date).getDay()], name(p.staffId) || p.name || '', p.kind === 'leave' ? '휴무 처리' : '근무',

        p.inBy === 'master' || p.outBy === 'master' ? '사장님 대리' : '', p.edited ? '수정됨' : '', p.inPhoto ? '있음' : p.inPhoto === null ? '없음' : '', p.note || ''].map(q).join(','));
      const csv = '﻿' + ['날짜,요일,직원,구분,출근,퇴근,정해진 시간,지각(분),대리 입력,수정,출근 사진,메모', ...lines].join('\r\n');
      if (await saveFile(`출퇴근기록_전체_${backupStamp()}.csv`, csv)) await backupMark('csv');
    } catch (e){ toast('기록을 모으지 못했어요', '인터넷 연결을 확인하고 다시 눌러 주세요.', 'warn'); console.warn(e); }
    finally { backupBusy = false; if (note) note.textContent = ''; render(true); }

};

function padPress(ctx, v){
  if (ctx === 'owner'){
    if (v === 'cancel'){ S.lockPin = ''; S.lockErr = ''; ACT.toKiosk(); return; }
    S.lockPin = v === 'back' ? S.lockPin.slice(0, -1) : (S.lockPin + v).slice(0, 4);
    S.lockErr = '';
    if (S.lockPin.length === 4){
      if (S.lockPin === String(cfg().ownerPin)){ S.unlocked = true; if (S.remember) store.set('ownerDevice', '1'); S.lockPin = ''; checkNotyet(); }
      else { S.lockErr = '번호가 맞지 않아요'; S.lockPin = ''; }
    }
    render(true); return;
  }
  const k = S.kiosk;
  if (v === 'cancel'){ resetKiosk(); render(true); return; }
  k.pin = v === 'back' ? k.pin.slice(0, -1) : (k.pin + v).slice(0, 4);
  k.err = '';
  if (k.pin.length === 4){
    const st = staffById(k.staffId);
    const master = String(cfg().masterPin || '');
    if (st && k.pin === String(st.pin)){ k.step = 'action'; k.pin = ''; k.master = false; }
    else if (st && master && k.pin === master){ k.step = 'action'; k.pin = ''; k.master = true; }   // 사장님 마스터 번호: 어느 직원이든 통과
    else { k.err = '번호가 맞지 않아요. 다시 입력해 주세요'; k.pin = ''; }
  }
  render(true);
}

async function kioskPunch(kind, shot){
  const k = S.kiosk, st = staffById(k.staffId);
  if (!st || k.busy) return;
  k.busy = true; render(true);
  const now = shot?.t || Date.now(), today = todayStr();
  try {
    if (kind === 'in'){
      const sc = schedFor(st, today, null);
      const late = sc && now > at(today, sc.start) + cfg().graceMin*60000 ? Math.round((now - at(today, sc.start))/60000) : 0;
      const ph = await photoFields('in', shot);
      await write(() => punchRef(st.id, today).set({ staffId:st.id, name:st.name, date:today, kind:'work', in:now, out:null, sched:sc, lateMin:late, edited:false, note:'', ...ph, ...(k.master ? { inBy:'master' } : {}) }));
      k.result = { kind:'in', t:now, late, photoErr: shot?.blob && !ph.inPhoto ? ph.inPhotoNote : '', msg: late ? `예정 ${sc.start}보다 ${late}분 늦었어요. 사장님께 알림이 갔어요.` : sc ? `오늘 퇴근 예정 ${sc.end} · 좋은 하루 보내세요!` : '추가 근무로 기록했어요.' };
      mailPunch(st, 'in', now, { late, sc, blob: shot?.blob, master: k.master });
      const need = await contractNeeded(st);
      if (need){ k.contractId = need.id; k.nextStep = 'contract'; }
    } else {
      const op = openPunch(st, now);
      if (!op){ toast('출근 기록이 없어요', '사장님께 확인을 요청하세요.', 'warn'); resetKiosk(); render(true); return; }
      const ph = await photoFields('out', shot);
      await write(() => punchRef(st.id, op.date).update({ out:now, ...ph, ...(k.master ? { outBy:'master' } : {}) }));
      const r = dayCalc(st, op.date, now);
      k.result = { kind:'out', t:now, late:false, photoErr: shot?.blob && !ph.outPhoto ? ph.outPhotoNote : '', msg:`오늘 ${fmtH(r.worked)} 근무했어요. 수고하셨어요!` };
      mailPunch(st, 'out', now, { worked:r.worked, blob: shot?.blob, master: k.master });
    }
    k.step = k.nextStep || 'done'; k.nextStep = null; k.at = Date.now(); beep('ok');
  } catch { if (k.step === 'photo') resetKiosk(); }
  k.busy = false; render(true);
}
async function savePunchEdit(kind){
  const [sid, ds] = S.editing.slice(6).split('|');
  const st = staffById(sid), p = getPunch(sid, ds);
  if (!st) return;
  const sc = p && p.sched !== undefined ? p.sched : schedFor(st, ds, null);
  const note = $('#ed-note')?.value.trim() || '';
  const keep = p ? Object.fromEntries(['inPhoto', 'inPhotoNote', 'outPhoto', 'outPhotoNote', 'inBy', 'outBy'].filter(f => p[f] !== undefined).map(f => [f, p[f]])) : {};   // 고쳐도 사진은 그대로
  let doc;
  if (kind === 'leave') doc = { ...keep, staffId:sid, name:st.name, date:ds, kind:'leave', in:null, out:null, sched:sc, lateMin:0, edited:true, note: note || '휴무 처리' };
  else {
    const tin = $('#ed-in').value, tout = $('#ed-out').value;
    if (!tin){ toast('출근 시각을 넣어 주세요', '', 'warn'); return; }
    const inMs = at(ds, tin);

    if (outMs !== null && outMs <= inMs) outMs += 86400000;
    const late = sc && inMs > at(ds, sc.start) + cfg().graceMin*60000 ? Math.round((inMs - at(ds, sc.start))/60000) : 0;
    doc = { ...keep, staffId:sid, name:st.name, date:ds, kind:'work', in:inMs, out:outMs, sched:sc, lateMin:late, edited:true, note };
  }
  await write(() => punchRef(sid, ds).set(doc));

  S.editing = null; render(true);
}
