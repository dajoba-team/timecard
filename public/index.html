      if (st && P.pin === String(st.pin)){ Object.assign(P, { staffId:st.id, pickId:null, pin:'', tab:'tasks' }); store.set('phoneStaff', st.id); plinkBeat[st.id] = true; savePhoneLink(st.id).catch(e => console.warn('phone link', e?.message || e)); }   // 연결 기록 (v38)
      else { P.err = '번호가 맞지 않아요. 다시 넣어 주세요'; P.pin = ''; }
    }
    render(true); return;
  }
  const k = S.kiosk;
  if (v === 'cancel'){ resetKiosk(); render(true); return; }
  k.pin = v === 'back' ? k.pin.slice(0, -1) : (k.pin + v).slice(0, 4);
  k.err = '';
  if (k.pin.length === 4){
    const st = staffById(k.staffId);
    const master = String(cfg().masterPin || '');
    if (st && k.pin === String(st.pin)){ k.step = phoneNeeded(st) ? 'phonereq' : 'action'; k.pin = ''; k.master = false; startGeo(); }   // 휴대폰 연결 안 했으면 안내부터 (v38)
    else if (st && master && k.pin === master){ k.step = 'action'; k.pin = ''; k.master = true; startGeo(); }   // 사장님 마스터 번호: 어느 직원이든 통과
    else { k.err = '번호가 맞지 않아요. 다시 입력해 주세요'; k.pin = ''; }
  }
  render(true);
}

async function kioskPunch(kind, shot){
  const k = S.kiosk, st = staffById(k.staffId);
  if (!st || k.busy) return;
  k.busy = true; render(true);
  const now = shot?.t || Date.now(), today = todayStr(), geo = shot && 'geo' in shot ? shot.geo : await geoNow();

      const sc = schedFor(st, today, null);
      const late = sc && now > at(today, sc.start) + cfg().graceMin*60000 ? Math.round((now - at(today, sc.start))/60000) : 0;
      const ph = await photoFields('in', shot);
      await write(() => punchRef(st.id, today).set({ staffId:st.id, name:st.name, date:today, kind:'work', in:now, out:null, sched:sc, lateMin:late, edited:false, note:'', ...ph, ...(k.master ? { inBy:'master' } : {}), ...(geo ? { inGeo:geo } : {}), ...(S.mode === 'phone' ? { inVia:'phone' } : {}) }));

        msgArgs: late ? ['예정 {a}보다 {n}분 늦었어요. 사장님께 알림이 갔어요.', { a:sc.start, n:late }] : sc ? ['오늘 퇴근 예정 {t} · 좋은 하루 보내세요!', { t:sc.end }] : ['추가 근무로 기록했어요.'] };
      mailPunch(st, 'in', now, { late, sc, blob: shot?.blob, master: k.master, geo });
      const need = await contractNeeded(st);
      if (need){ k.contractId = need.id; k.nextStep = 'contract'; }
    } else {
      const op = openPunch(st, now);
      if (!op){ toast('출근 기록이 없어요', '사장님께 확인을 요청하세요.', 'warn'); resetKiosk(); render(true); return; }
      const ph = await photoFields('out', shot);
      await write(() => punchRef(st.id, op.date).update({ out:now, ...ph, ...(k.master ? { outBy:'master' } : {}), ...(geo ? { outGeo:geo } : {}), ...(S.mode === 'phone' ? { outVia:'phone' } : {}) }));
      const r = dayCalc(st, op.date, now);
      k.result = { kind:'out', t:now, late:false, photoErr: shot?.blob && !ph.outPhoto ? ph.outPhotoNote : '', msg:`오늘 ${fmtH(r.worked)} 근무했어요. 수고하셨어요!`, worked:r.worked };
      const r2 = dayCalc(st, op.date, now, { ...op, out:now });   // 추가근무 승인제: 승인으로 덮이지 않은 추가근무가 있으면 이유 묻기
      if (r2.otWait > 0){ const o = otDoc(st.id, op.date); S.otForm = { mode:'post', staffId:st.id, ds:op.date, extra:r2.otRaw, okMin:r2.ot, reason:o?.reason || '', note:o?.note || '' }; S.editing = 'ot'; k.nextStep = 'ot'; }
      mailPunch(st, 'out', now, { worked:r.worked, blob: shot?.blob, master: k.master, geo });
    }
    k.step = k.nextStep || 'done'; k.nextStep = null; k.at = Date.now(); beep('ok');

  } catch { if (k.step === 'photo') resetKiosk(); }
  k.busy = false; render(true);
}
async function savePunchEdit(kind){
  const [sid, ds] = S.editing.slice(6).split('|');

  if (!st) return;
  const sc = p && p.sched !== undefined ? p.sched : schedFor(st, ds, null);
  const note = $('#ed-note')?.value.trim() || '';
  const keep = p ? Object.fromEntries(['inPhoto', 'inPhotoNote', 'outPhoto', 'outPhotoNote', 'inBy', 'outBy', 'inGeo', 'outGeo'].filter(f => p[f] !== undefined).map(f => [f, p[f]])) : {};   // 고쳐도 사진은 그대로

    const inMs = at(ds, tin);

  S.editing = null; render(true);

  if (clash){ toast('마스터 번호가 직원 번호와 같아요', `${clash.name}님의 개인 번호와 겹쳐요. 다른 번호로 정해 주세요.`, 'warn'); return; }
  const doc = { storeName: $('#c-name').value.trim() || '우리 가게', ownerPin: pin, masterPin: master,
    graceMin: Math.max(0, Math.round(+$('#c-grace').value || 0)), otUnit: Math.max(1, Math.round(+$('#c-unit').value || 1)),
    earlyClamp: $('#c-early').checked, otPremium: $('#c-prem').checked, weeklyHoliday: $('#c-hol').checked,
    ot: $('#c-otapp')?.checked ? { on:true, since: cfg().ot.on && cfg().ot.since ? cfg().ot.since : todayStr() } : { on:false, since:'' },   // 켠 날부터 적용
    evalStart: $('#c-evalStart') ? ($('#c-evalStart').value || '') : cfg().evalStart,   // 출퇴근 평가 시작일 (v34, 비우면 처음부터)
    phoneReq: $('#c-phoneReq') ? { on: !!$('#c-phoneReq').checked, deadline: $('#c-phoneDeadline')?.value || addDays(todayStr(), 7) } : cfg().phoneReq,   // 직원 휴대폰 연결 필수 (v38)
    rates:{ np:+$('#c-np').value || 0, hi:+$('#c-hi').value || 0, ltc:+$('#c-ltc').value || 0, ei:+$('#c-ei').value || 0 },
    mail: readMailForm(), photo:{ ...cfg().photo, on: $('#p-on').checked }, geo:{ ...cfg().geo, radius: Math.max(30, Math.round(+$('#c-georad').value || 200)) } };
  if (doc.mail.on && !mailAddrs(doc.mail.to).length){ toast('받을 메일 주소를 넣어 주세요', '메일 알림을 켜려면 주소가 필요해요.', 'warn'); return; }
  await write(() => S.db.doc('config/main').set({ ...S.config, ...doc }));
  toast('설정을 저장했어요', '', 'ok');
  S.editing = null; render(true);
}
function readMailForm(){
  return { on: $('#m-on').checked, to: mailAddrs($('#m-to').value).join(', '),
    ev:{ in: $('#m-in').checked, late: $('#m-late').checked, notyet: $('#m-notyet').checked, out: $('#m-out').checked } };
}
async function clearSamples(){
  const ids = new Set(S.staff.filter(s => s.sample).map(s => s.id));
  let n = 0;
  for (const ym of Object.keys(S.months)) for (const p of [...S.months[ym].values()]) if (ids.has(p.staffId)){ await write(() => S.db.doc(`months/${ym}/punches/${p.id}`).delete()); n++; }
  for (const id of ids) await write(() => S.db.doc('staff/' + id).delete());
  toast('예시 데이터를 지웠어요', `직원 ${ids.size}명 · 기록 ${n}건`, 'ok');
  render(true);
}
async function saveFile(filename, data){
  const dl = window.tcStore?.use ? await window.tcStore.use('downloads') : null;
  if (!dl){ toast('이 화면에서는 파일 저장을 쓸 수 없어요', '대신 ‘표 복사’로 엑셀에 붙여 넣어 주세요.', 'warn'); return; }
  try { await dl.save({ filename, data }); toast('파일을 저장했어요', filename, 'ok'); return true; }
  catch (e){ if (e?.code !== 'declined') toast('저장하지 못했어요', e?.message || '', 'warn'); }
}
function copyText(text, title = '복사했어요', body = '카카오톡이나 메모에 붙여 넣으세요.'){
  const fallback = () => {
    const m = $('#modal');
    m.innerHTML = `<div class="box"><h3 style="margin-bottom:8px">아래 내용을 길게 눌러 복사하세요</h3><textarea id="copyBox" readonly>${esc(text)}</textarea><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="closeModal">닫기</button></div></div>`;
    m.hidden = false; const ta = $('#copyBox'); ta.focus(); ta.select();
    $('#closeModal').onclick = () => { m.hidden = true; };
  };
  try { navigator.clipboard.writeText(text).then(() => toast(title, body, 'ok'), fallback); } catch { fallback(); }
}
let wake = null;
function requestWake(){ if (S.mode !== 'kiosk' || wake) return; try { navigator.wakeLock?.request('screen').then(w => { wake = w; w.addEventListener('release', () => { wake = null; }); }).catch(() => {}); } catch {} }

/* ===================== 시계 · 시작 ===================== */
let lastDay = todayStr();
function tick1(){
  const now = Date.now();
  const t = $('#ktime'); if (t) t.textContent = fmtClock(now);
  const ct = $('#camtime'); if (ct) ct.textContent = fmtClock(now);
  const k = S.kiosk;
  if ((S.mode === 'kiosk' || S.mode === 'phone') && k.step !== 'list' && !k.busy){
    const idle = now - (k.at || now), st = staffById(k.staffId);
    if (k.step === 'done' && k.didIn && idle > 2500 && kNextStep(st)){ k.step = kNextStep(st); k.at = now; render(true); }   // 출근 도장 → 새 공지·오늘 할 일
    else if ((k.step === 'done' && idle > 6000) || idle > (k.step === 'contract' ? 300000 : ['notices', 'remind', 'outwarn', 'ot', 'otreq', 'thanks', 'phonereq'].includes(k.step) ? 120000 : 30000)){ resetKiosk(); render(true); }
  }
  if (todayStr() !== lastDay){
    lastDay = todayStr(); S.notified = new Set(); S.mailed = new Set();
    const ym = ymOf(lastDay); needMonth(ym); needTR(ym);
    const kd = $('#kdate'); if (kd) kd.textContent = fmtDateLong(lastDay);
    scheduleRender();
  }
}
function tick30(){
  checkNotyet();
  checkNotyetMail().catch(err => console.warn(err));
  autoReport().catch(err => console.warn(err));
  cleanWorkPhotos();
  if (S.mode === 'owner' && S.unlocked && ['now','payroll','tasks'].includes(S.tab)) render(false);
  else if ((S.mode === 'kiosk' || S.mode === 'phone') && S.kiosk.step === 'list') render(false);
  else renderTop();
}
async function boot(){
  const h = (location.hash || '').slice(1);
  if (h === 'phone' || h === 'kiosk') store.set('device', h);   // 주소 끝 #phone = 직원 휴대폰, #kiosk = 가게 태블릿
  S.mode = h === 'kiosk' || h === 'phone' ? h : TABS.some(t => t[0] === h) ? 'owner' : (store.get('mode') || deviceMode());
  if (S.mode === 'kiosk' || S.mode === 'phone') S.mode = deviceMode();
  S.tab = TABS.some(t => t[0] === h) ? h : (store.get('tab') || 'now');
  S.unlocked = S.mode === 'owner' && store.get('ownerDevice') === '1';
  loadNotified(); loadMailed();
  S.pending = window.tcStore?.pendingCount?.() || 0;
  window.addEventListener?.('tc-pending', e => { S.pending = e.detail || 0; renderBanner(); if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); });
  render(true);
  setInterval(tick1, 1000);
  setInterval(tick30, 30000);
  connTimer = setTimeout(() => { if (!S.connected && !S.noDb){ S.connNote = '저장소 응답을 기다리고 있어요. 인터넷 연결을 확인해 주세요.'; renderBanner(); } }, 10000);
  const db = window.tcStore?.use ? await window.tcStore.use('db') : null;
  if (!db){ clearTimeout(connTimer); S.noDb = true; S.ready.staff = true; render(true); return; }
  S.db = db;
  if (isPhoneAcct()){ store.set('device', 'phone'); store.set('mode', 'phone'); S.mode = 'phone'; S.unlocked = false; }   // 직원용 공용 계정은 직원 휴대폰 화면만 (v39)
  db.doc('config/main').onSnapshot(s => { S.config = s.exists ? s.data() : {}; S.ready.config = true; if (!s.metadata.fromCache) markConnected(); scheduleRender(); }, e => console.warn('config', e));
  db.collection('staff').onSnapshot(s => {
    S.staff = s.docs.map(d => ({ id:d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), 'ko'));
    S.ready.staff = true; if (!s.metadata.fromCache) markConnected(); scheduleRender();
  }, e => { S.ready.staff = true; console.warn('staff', e); scheduleRender(); });
  db.collection('contracts').onSnapshot(s => { S.contracts = s.docs.map(d => ({ id:d.id, ...d.data() })); S.ready.contracts = true; scheduleRender(); }, e => { S.ready.contracts = true; console.warn('contracts', e); scheduleRender(); });
  db.collection('reports').onSnapshot(s => { S.reports = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); S.ready.reports = true; scheduleRender(); }, e => { S.ready.reports = true; console.warn('reports', e); });
  db.doc('config/sign').onSnapshot(s => { const d = s.exists ? s.data().data : ''; S.ownerSign = SIG_RE.test(d || '') ? d : ''; scheduleRender(); }, e => console.warn('sign', e));
  db.doc('status/backup').onSnapshot(s => { S.backupStatus = s.exists ? s.data() : null; if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); }, e => console.warn('backup', e));
  db.collection('awards').onSnapshot(s => { S.awards = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('awards', e));
  db.collection('award_reacts').onSnapshot(s => { S.reacts = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('award_reacts', e));
  db.collection('phone_links').onSnapshot(s => { S.plinks = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('phone_links', e));   // 직원 휴대폰 연결 (v38)
  db.collection('badges').onSnapshot(s => { S.badges = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('badges', e));   // 동기부여 (v32)
  db.collection('thanks').onSnapshot(s => { S.thanks = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('thanks', e));
  db.collection('ot').onSnapshot(s => { S.ots = new Map(s.docs.map(d => [d.id, d.data()])); scheduleRender(); }, e => console.warn('ot', e));   // 추가근무 요청·승인
  db.collection('praise').onSnapshot(s => { S.praise = s.docs.map(d => ({ id:d.id, ...d.data() })); scheduleRender(); }, e => console.warn('praise', e));
  db.doc('status/autobackup').onSnapshot(s => { S.autoBackup = s.exists ? s.data() : null; if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); }, e => console.warn('autobackup', e));
  db.collection('backups').onSnapshot(s => { S.backups = s.docs.map(d => ({ id:d.id, ...d.data() })); if (S.mode === 'owner' && S.tab === 'staff') scheduleRender(); }, e => console.warn('backups', e));
  db.doc('status/alert').onSnapshot(s => { S.alertStatus = s.exists ? s.data() : null; if (S.mode === 'owner') scheduleRender(); }, e => console.warn('alert', e));
  db.doc('status/mail').onSnapshot(s => { S.mailStatus = s.exists ? s.data() : null; if (S.mode === 'owner') scheduleRender(); }, e => console.warn('mail', e));
  needMonth(ymOf(todayStr()));
  bootTasks(db);
  setTimeout(cleanWorkPhotos, 5000);
}
boot();
</script>
